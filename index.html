<style>
html,body{margin:0}
/* Layout: sticky header + tab rail, one working surface per tab; tables scroll inside their own box */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#15211C; --muted:#5A6B63; --line:#D3DCD8;
  --accent:#D9480F; --accent-ink:#FFFFFF; --accent-soft:#FBE3D6;
  --ok:#2B7A4B; --ok-soft:#DDF0E4; --warn:#A86A0B; --warn-soft:#F8EBCF; --bad:#B42318; --bad-soft:#F9DEDB; --info:#1F5E9C; --info-soft:#DCE8F5;
  --t-hot:#C2410C; --t-cold:#1D5FA8; --t-height:#B7791F; --t-lift:#6B4FA0; --t-conf:#0F766E; --t-elec:#A61E4D; --t-exc:#6B5B45;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2824; --ink:#E4ECE8; --muted:#93A59C; --line:#2B3833;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --accent-soft:#3A2116;
  --ok:#5CC48A; --ok-soft:#173527; --warn:#E9B04F; --warn-soft:#3A2D12; --bad:#F2776B; --bad-soft:#3D1C19; --info:#7FB2E8; --info-soft:#18293B;
  --t-hot:#FF8A4C; --t-cold:#6FA8EA; --t-height:#E9B04F; --t-lift:#B39AE6; --t-conf:#4CC7BA; --t-elec:#F27BA3; --t-exc:#C8B79A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2824; --ink:#E4ECE8; --muted:#93A59C; --line:#2B3833;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --accent-soft:#3A2116;
  --ok:#5CC48A; --ok-soft:#173527; --warn:#E9B04F; --warn-soft:#3A2D12; --bad:#F2776B; --bad-soft:#3D1C19; --info:#7FB2E8; --info-soft:#18293B;
  --t-hot:#FF8A4C; --t-cold:#6FA8EA; --t-height:#E9B04F; --t-lift:#B39AE6; --t-conf:#4CC7BA; --t-elec:#F27BA3; --t-exc:#C8B79A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{direction:rtl;min-height:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand h1{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:0;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.sync{margin-inline-start:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:600 14px var(--f-body);color:var(--muted);background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:15.5px;font-weight:600;margin:0 0 10px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head .grow{flex:1}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipbtn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn.sm{font-size:12.5px;padding:5px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
.filters input[type=search]{flex:1 1 200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tile{display:flex;flex-direction:column;gap:4px}
.tile .lbl{color:var(--muted);font-size:13px}
.tile .val{font:600 30px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.tile .note{font-size:12.5px;color:var(--muted)}
.tile.alert .val{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:right;padding:9px 10px;background:var(--sunk);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.num{font-family:var(--f-num);font-size:13px;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-open{background:var(--info-soft);color:var(--info)} .p-appr{background:var(--ok-soft);color:var(--ok)}
.p-susp{background:var(--warn-soft);color:var(--warn)} .p-closed{background:var(--sunk);color:var(--muted)} .p-canc{background:var(--bad-soft);color:var(--bad)}
.type{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.type i{width:10px;height:10px;border-radius:2px;display:inline-block}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:16px;margin-bottom:4px}
.row-actions{display:flex;gap:2px;justify-content:flex-end;flex-wrap:nowrap}
.stock-low{color:var(--bad);font-weight:600}
.bar-meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:70px}
.bar-meter span{display:block;height:100%;background:var(--accent)}
.bar-meter span.ok{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 12.5px var(--f-body);border:0;background:var(--surface);color:var(--muted);padding:6px 10px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"].s-p{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].s-a{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].s-v{background:var(--info-soft);color:var(--info)}
.seg button[aria-pressed="true"].s-m{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"].s-e{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:flex;justify-content:flex-start}
.sheet{direction:rtl;background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sheet .head{margin-bottom:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.serial{font:600 22px var(--f-num);direction:ltr;color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:end}
.msg{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad)}
.msg.okm{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;direction:rtl}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13.5px}
[hidden]{display:none!important}
.grid .full{grid-column:1/-1}
.kpi-target{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
.pvw canvas{width:100%;height:auto;display:block;border:1px solid var(--line);margin-bottom:10px;background:#fff}
.report-text{white-space:pre-wrap;font-size:13px;background:var(--sunk);padding:12px;border-radius:8px;max-height:280px;overflow:auto}
@media (max-width:620px){
  .form{grid-template-columns:1fr}
  .brand small{display:none}
  .tile .val{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

          <div><h1>منظومة السلامة</h1><small id="projectName">HSE · جاري التحميل</small></div>

<script>
/* ---------- constants ---------- */
const PTW_TYPES = {
  HOT:{ar:"أعمال ساخنة",en:"Hot Work",c:"--t-hot"},
  COLD:{ar:"أعمال باردة",en:"Cold Work",c:"--t-cold"},
  HEIGHT:{ar:"عمل على ارتفاع",en:"Work at Height",c:"--t-height"},
  LIFT:{ar:"رفع",en:"Lifting",c:"--t-lift"},
  CONF:{ar:"أماكن مغلقة",en:"Confined Space",c:"--t-conf"},
  ELEC:{ar:"كهرباء",en:"Electrical",c:"--t-elec"},
  EXC:{ar:"حفر",en:"Excavation",c:"--t-exc"}
};
const PTW_STATUS = {open:["مفتوح","p-open"],approved:["معتمد","p-appr"],suspended:["موقوف","p-susp"],closed:["مغلق","p-closed"],cancelled:["ملغي","p-canc"]};
const RISK = {low:"منخفض",med:"متوسط",high:"عالي"};
const ATT = {p:["حاضر","s-p"],a:["غياب","s-a"],v:["إجازة","s-v"],m:["مأمورية","s-m"],e:["إذن","s-e"]};
const KPIS = [
  {k:"inspection",ar:"الفحص الدوري",def:40},
  {k:"unsafeCond",ar:"الظروف غير الآمنة",def:20},
  {k:"unsafeActs",ar:"الأفعال غير الآمنة",def:20},
  {k:"corrective",ar:"الإجراءات التصحيحية",def:40},
  {k:"tbt",ar:"محاضرات التوعية",def:7}
];
const LEAVE_T = {casual:"عارضة",annual:"اعتيادي",other:"أخرى"};
const DUTY_K = {duty:"تيم ديوتي",mission:"مأمورية",perm:"إذن ساعتين"};
const GROUPS = {hse:"فريق السلامة",sup:"فريق الإشراف",worker:"موظفين الشركة",ctr:"عمالة مقاول",other:"أخرى"};

/* ---------- state ---------- */
const S = {profiles:[],members:[],actions:[],tasks:[],equipment:[],contractors:[],records:[],employees:[],items:[],moves:[],permits:[],kpi:[],att:[],leaves:[],settings:{}};
const loaded = {};
let assetsNS=null;const ME={id:"",name:""};
let BASE={del:false,write:true};let db=null, userNS=null, canDelete=false, canWrite=true, online=false, booted=false, isOwner=false, importing=false;
const more={};
let tab = "dash";
const ui = {actF:"open",actQ:"",eqKind:"ext",mpG:"",mpQ:"",mpCtr:"",personSel:"",personBack:"",ctrSel:"",empG:"",leaveMonth:thisMonth(),dutyMonth:thisMonth(),ptwQ:"",ptwType:"",ptwStatus:"",ptwMonth:"",ppeSub:"items",ppeQ:"",ppeMonth:thisMonth(),teamSub:"att",attDate:today(),empQ:"",kpiSub:"entry",kpiMonth:thisMonth(),repMonth:thisMonth()};
try{ const t=localStorage.getItem("hse.tab"); if(t) tab=t; }catch(e){}

/* ---------- helpers ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function thisMonth(){return today().slice(0,7)}
function fmtDate(s){if(!s)return "";const [y,m,d]=s.split("-");return `${d}/${m}/${y}`}
function monthName(ym){const [y,m]=ym.split("-");const n=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"][+m-1];return `${n} ${y}`}
function num(v){const n=Number(v);return isFinite(n)?n:0}
function emp(id){return S.employees.find(e=>e.id===id)}
function empName(id){return emp(id)?.name||"—"}
function item(id){return S.items.find(i=>i.id===id)}
function hseTeam(){return S.employees.filter(e=>e.group==="hse"&&e.active!==false).sort((a,b)=>a.name.localeCompare(b.name,"ar"))}
function activeEmps(){return S.employees.filter(e=>e.active!==false).sort((a,b)=>a.name.localeCompare(b.name,"ar"))}
function typeChip(t){const T=PTW_TYPES[t]||{ar:t,c:"--muted"};return `<span class="type"><i style="background:var(${T.c})"></i>${esc(T.ar)}</span>`}
function statusPill(s){const p=PTW_STATUS[s]||[s,"p-closed"];return `<span class="pill ${p[1]}">${p[0]}</span>`}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
let _balRef=null,_bal=null;
function moveTotals(){if(_balRef!==S.moves){_bal={};for(const m of S.moves){const o=(_bal[m.itemId]??={inn:0,out:0});if(m.type==="receipt")o.inn+=num(m.qty);else o.out+=num(m.qty)}_balRef=S.moves}return _bal}
function balance(itemId){const it=item(itemId);const o=moveTotals()[itemId]||{inn:0,out:0};return num(it?.opening)+o.inn-o.out}
function nextSerial(type){
  const start = num(S.settings.serials?.[type]) || 1;
  let max = 0; for(const p of S.permits){ if(p.type===type) max=Math.max(max,num(p.serial)); }
  return Math.max(start, max+1);
}
function nextVoucher(){let m=0;for(const x of S.moves){if(x.voucher){const n=parseInt(String(x.voucher).replace(/\D/g,""));if(n>m)m=n}}return m+1}
function attDoc(date){return S.att.find(a=>a.id===date)}
function page(L,key,n=150){const lim=more[key]||n;return {rows:L.slice(0,lim),btn:L.length>lim?`<div style="text-align:center;margin-top:10px"><button class="btn sm" onclick="more['${key}']=${lim+n*2};refresh()">اعرض ${Math.min(n*2,L.length-lim)} كمان (من ${L.length})</button></div>`:""}}
function emptyState(title,body,btn){return `<div class="empty"><b>${title}</b>${body}${btn?`<div style="margin-top:12px">${btn}</div>`:""}</div>`}
function waiting(k){return (!loaded[k]||!legacyLoaded) && db ? `<div class="empty">بيحمّل…</div>` : ""}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("اتنسخ");}catch(e){toast("حدّد النص وانسخه بإيدك")}}

/* ---------- data layer ---------- */
async function write(fn, okMsg){
  if(!db){toast("مفيش اتصال بقاعدة البيانات");return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    const c=e?.code;
    if(c==="invalid_argument"){canWrite=false;toast("مش مسموح لك تعدّل البيانات دي")}
    else if(c==="quota_exceeded"){toast("المساحة اتملت، امسح بيانات قديمة")}
    else toast("الحفظ فشل، جرّب تاني");
    console.error(e);return false
  }
}
let LEG={},legacyLoaded=false;const LIVE={};
function merge(k){const live=LIVE[k]||[];const leg=LEG[k]||[];if(!leg.length){S[k]=live.filter(x=>!x._deleted);return}
  const ids=new Map(live.map(x=>[x.id,x]));const out=[];for(const r of leg){const o=ids.get(r.id);if(o){ids.delete(r.id);if(!o._deleted)out.push(o)}else out.push(r)}for(const o of ids.values())if(!o._deleted)out.push(o);S[k]=out}
function current(col,id){const k=Object.keys(COLS).find(x=>COLS[x]===col);return (S[k]||[]).find(x=>x.id===id)}
async function upsert(col,id,data){const cur=current(col,id)||{};const {id:_,...rest}=cur;await db.doc(col+"/"+id).set({...rest,...data})}
async function remove(col,id){const k=Object.keys(COLS).find(x=>COLS[x]===col);if((LEG[k]||[]).some(r=>r.id===id))await db.doc(col+"/"+id).set({_deleted:true});else await db.doc(col+"/"+id).delete()}
const COLS={actions:"actions",tasks:"tasks",equipment:"equipment",contractors:"contractors",records:"records",employees:"employees",items:"ppe_items",moves:"ppe_moves",permits:"permits",kpi:"kpi_entries",att:"attendance",leaves:"leaves"};
async function boot(){
  setSync("بيتصل…","");
  if(!window.claude?.use){booted=true;setSync("مش متصل","off");show(tab);return}
  db = await window.claude.use("db");
  userNS = await window.claude.use("user");
  window.claude.use("assets").then(a=>{assetsNS=a;if(a)refresh()}).catch(()=>{});
  try{ME.id=(await userNS?.id())||"";ME.name=(await userNS?.name())||"";const mb=document.getElementById("meBtn");if(mb)mb.textContent="👤 "+ME.name}catch(e){}
  booted=true;
  if(!db){setSync("مش متصل","off");show(tab);return}
  try{canDelete = await userNS?.canEdit() ?? false; isOwner = await userNS?.isOwner() ?? false}catch(e){}
  try{const w=await userNS?.can("data.write"); if(w===false) canWrite=false}catch(e){}
  BASE={del:canDelete,write:canWrite};
  setSync("متصل","on"); online=true;
  for(const [k,p] of Object.entries(COLS)){
    db.collection(p).onSnapshot(s=>{LIVE[k]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[k]=true;merge(k);refresh()},()=>setSync("الاتصال اتقطع","off"));
  }
  db.collection("legacy").onSnapshot(s=>{const acc={};for(const d of s.docs){const x=d.data();(acc[x.kind]??=[]).push(...(x.rows||[]))}LEG=acc;legacyLoaded=true;for(const k of Object.keys(COLS))merge(k);refresh()},()=>{});
  db.collection("__profiles").onSnapshot(s=>{S.profiles=s.docs.map(d=>({id:d.id,...d.data()}));const me=S.profiles.find(p=>p.id===ME.id);if(me){window.SBA.profile=me;if(me.disabled){location.reload()}}applyRole();if(tab==="settings")refresh()},()=>{});
  db.collection("members").onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="settings")refresh()},()=>{});
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};loaded.settings=true;applyRole();document.getElementById("projectName").textContent="HSE · "+(S.settings.project||"المشروع");refresh()},()=>{});
  show(tab);
}

function openSheet(title,body,onSave,saveLabel="حفظ"){
  const root=$("overlayRoot");
  root.innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="head"><h2 class="grow">${esc(title)}</h2><button class="btn ghost" id="shClose" aria-label="إغلاق">✕</button></div>
    <form id="shForm">${body}<div id="shMsg"></div>
    <div style="display:flex;gap:8px;margin-top:18px"><button class="btn primary" type="submit" ${!canWrite?"disabled":""}>${esc(saveLabel)}</button><button class="btn" type="button" id="shCancel">إلغاء</button></div></form></div></div>`;
  const close=()=>{root.innerHTML=""};
  $("shClose").onclick=close;$("shCancel").onclick=close;
  $("ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  $("shForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const fd=Object.fromEntries(new FormData(e.target).entries());
    const err=await onSave(fd,e.target);
    if(err){$("shMsg").innerHTML=`<div class="msg" style="margin-top:12px">${esc(err)}</div>`;return}
    close();
  });
  setTimeout(()=>root.querySelector("input,select,textarea")?.focus(),30);
  return root;
}
function confirmSheet(title,text,onYes,yesLabel="امسح"){
  openSheet(title,`<p>${esc(text)}</p>`,async()=>{await onYes()},yesLabel);
}
function f(label,name,{type="text",value="",full=false,opts=null,req=false,attrs=""}={}){
  let input;
  if(opts) input=`<select name="${name}" id="f_${name}" ${req?"required":""} ${attrs}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
  else if(type==="textarea") input=`<textarea name="${name}" id="f_${name}" ${attrs}>${esc(value)}</textarea>`;
  else input=`<input type="${type}" name="${name}" id="f_${name}" value="${esc(value)}" ${req?"required":""} ${attrs}>`;
  return `<div class="field ${full?"full":""}"><label for="f_${name}">${label}</label>${input}</div>`;
}

function resolveItem(txt){const s=String(txt||"").trim();if(!s)return null;const n=normName(s);
  let x=S.items.find(i=>itemLabel(i)===s)||S.items.find(i=>String(i.code)===s);if(x)return x;
  const m=S.items.filter(i=>normName(i.name).includes(n)||String(i.code).includes(s));return m.length===1?m[0]:(m.find(i=>normName(i.name)===n)||null)}
function resolveEmp(txt){const s=String(txt||"").trim();if(!s)return null;const n=normName(s);
  let x=S.employees.find(e=>e.name+(e.code?" · "+e.code:"")===s)||S.employees.find(e=>String(e.code)===s);if(x)return x;
  const m=S.employees.filter(e=>normName(e.name).includes(n));return m.length===1?m[0]:(m.find(e=>normName(e.name)===n)||null)}
function personHistoryHTML(e,full){

function issueForm(){
  if(!S.items.length){toast("ضيف أصناف الأول");return}

  const lineHTML=()=>`<div class="line"><div class="field"><label>الصنف (اكتب الاسم أو الكود)</label><input name="item" list="itemList" autocomplete="off" placeholder="مثلاً: جوانتي أو 2601020023"><small class="muted bal" style="font-size:12px"></small></div><div class="field"><label>الكمية</label><input type="number" name="qty" min="1" step="any" value="1"></div><button type="button" class="btn ghost" aria-label="شيل السطر" onclick="this.parentElement.remove();syncLines()">✕</button></div>`;
  openSheet("إذن صرف مهمات",`<div class="form">
    <div class="field"><label>رقم الإذن</label><div class="serial">IR-${nextVoucher()}</div></div>
    ${f("التاريخ","date",{type:"date",value:today(),req:true})}
    <div class="field full"><label for="f_emp">المستلم (اكتب الاسم أو الكود)</label><input id="f_emp" name="emp" list="empList" autocomplete="off" placeholder="اسم الموظف أو كوده"><small class="muted" id="empInfo" style="font-size:12px"></small><div id="empHist"></div></div>
    <div class="full"><div class="lines" id="lines">${lineHTML()}</div><button type="button" class="btn sm" id="addLine" style="margin-top:8px">+ صنف تاني</button> <span class="muted" style="font-size:12px">النموذج بياخد ${MAX} أصناف بالكتير</span></div>
    ${f("ملاحظات","note",{full:true})}</div>${itemDatalist()}${empDatalist(activeEmps())}`,
  async(fd,form)=>{
    const e=resolveEmp(fd.emp);if(!e)return "اختار المستلم من القايمة (اكتب جزء من الاسم أو الكود)";
    const raw=[...form.querySelectorAll(".line")].map(l=>({t:l.querySelector("[name=item]").value.trim(),qty:num(l.querySelector("[name=qty]").value)})).filter(l=>l.t);
    if(!raw.length)return "اكتب صنف واحد على الأقل";
    if(raw.length>MAX)return `الإذن بياخد ${MAX} أصناف بس`;
    const lines=[];for(const r of raw){const it=resolveItem(r.t);if(!it)return `الصنف «${r.t}» مش موجود أو فيه أكتر من صنف بنفس الكلام. اختار من القايمة`;if(r.qty<=0)return `اكتب كمية ${it.name}`;lines.push({itemId:it.id,qty:r.qty})}
    const need={};for(const l of lines)need[l.itemId]=(need[l.itemId]||0)+l.qty;

    const voucher="IR-"+nextVoucher();
    const ok=await write(async()=>{for(const l of lines){await db.collection("ppe_moves").add({type:"issue",voucher,itemId:l.itemId,qty:l.qty,empId:e.id,date:fd.date,note:fd.note.trim(),createdAt:Date.now()})}},`اتسجل إذن الصرف ${voucher}`);
    if(ok)setTimeout(()=>printVoucher(voucher),400);
    return ok?null:"الحفظ فشل";
  },"سجّل الإذن");
  window.syncLines=()=>{const n=$("lines").querySelectorAll(".line").length;$("addLine").hidden=n>=MAX};
  $("addLine").onclick=()=>{if($("lines").querySelectorAll(".line").length<MAX)$("lines").insertAdjacentHTML("beforeend",lineHTML());syncLines()};
  $("lines").addEventListener("input",ev=>{const inp=ev.target.closest("[name=item]");if(!inp)return;const it=resolveItem(inp.value);const e=resolveEmp($("f_emp").value);let warn="";
    if(it&&e){const last=S.moves.filter(m=>m.type==="issue"&&m.empId===e.id&&m.itemId===it.id).sort((x,y)=>(y.date||"").localeCompare(x.date||""))[0];if(last){const d=Math.round((new Date(today())-new Date(last.date))/864e5);warn=` · ⚠ استلم نفس الصنف ${fmtDate(last.date)} (من ${d} يوم)`}}
    const el=inp.parentElement.querySelector(".bal");el.textContent=it?`${it.name} · الرصيد المتاح ${balance(it.id)} ${it.unit||""}${warn}`:"";el.style.color=warn?"var(--warn)":""});
  $("f_emp").addEventListener("input",ev=>{const e=resolveEmp(ev.target.value);$("empInfo").textContent=e?`${e.name} · ${e.job||""} · ${e.code||""}`:"";$("empHist").innerHTML=personHistoryHTML(e,false)});
}

  try{say("بيقرا الملف…");const J=JSON.parse(await file.text());let n=0;
    const docs=J.docs||[];for(let i=0;i<docs.length;i+=200){const chunk=docs.slice(i,i+200).map(d=>({col:d.col,id:d.id,data:d.data,updated_at:new Date().toISOString()}));
      if(chunk.some(d=>d.col==="settings")){for(const d of chunk.filter(d=>d.col==="settings")){const cur=S.settings||{};d.data={...d.data,...Object.fromEntries(Object.entries(cur).filter(([k])=>["webUrl"].includes(k)))}}}
      const {error}=await SB.from("docs").upsert(chunk);if(error)throw error;n+=chunk.length;say(`اتنقل ${n} من ${docs.length} سجل…`)}
    for(const p of J.private||[]){const {error}=await SB.from("private_docs").upsert({id:p.id,data:p.data});if(error)throw error}
    let fdone=0;for(const fl of J.files||[]){const bin=Uint8Array.from(atob(fl.b64),c=>c.charCodeAt(0));const {error}=await SB.storage.from("files").upload(fl.id,new Blob([bin],{type:fl.type}),{contentType:fl.type,upsert:true});if(error&&!/exists/i.test(error.message))throw error;fdone++}
    say(`✔ خلص النقل: ${n} سجل و${fdone} صورة والتوقيع. حدّث الصفحة.`);toast("خلص النقل")}catch(e){console.error(e);say("النقل فشل: "+(e.message||e))}}

const CHECKLIST_FORMS=["F-HSE-05-01","F-HSE-08-02","F-HSE-30-02","F-HSE-07-02"];
function deriveActions(){
  const out=[];const F2=FORMS2||{};const addD=(d,n)=>{try{const x=new Date((d||today())+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}catch(e){return today()}};
  for(const r of S.records){const sp=F2[r.form]||{};
    if(CHECKLIST_FORMS.includes(r.form))(r.rows||[]).forEach((row,i)=>{if(row?.res==="nok")out.push({id:`${r.id}_${i}`,recId:r.id,form:r.form,date:r.date,kind:"تفتيش",title:(sp.rows?.items?.[i]||`بند ${i+1}`).replace(/^[^.]*\.\s*/,""),detail:[row.measure,row.ncr&&("NCR "+row.ncr)].filter(Boolean).join(" · "),place:r.f?.site||"",due:addD(r.date,3)})});
    if(r.form==="F-HSE-07-03")(r.rows||[]).forEach((row,i)=>{if(row?.desc)out.push({id:`${r.id}_${i}`,recId:r.id,form:r.form,date:r.date,kind:"ملاحظة",title:row.desc,detail:row.action||"",place:row.place||"",due:addD(r.date,String(row.risk||"").startsWith("1")?1:7)})});
    if(r.form==="F-HSE-07-01")out.push({id:r.id+"_v",recId:r.id,form:r.form,date:r.date,kind:"مخالفة",title:r.f?.desc||"مخالفة",detail:[r.f?.emp,r.f?.action].filter(Boolean).join(" · "),place:r.f?.place||"",empId:r.f?.emp_id,due:addD(r.date,3)});
    if(r.form==="F-HSE-03-01"&&(r.f?.corrective||r.f?.immediate))out.push({id:r.id+"_c",recId:r.id,form:r.form,date:r.date,kind:"حادث",title:"إجراء تصحيحي: "+(r.f?.corrective||r.f?.immediate),detail:r.f?.desc||"",place:r.f?.place||"",ownerName:r.f?.resp||"",due:/^\d{4}-\d\d-\d\d$/.test(r.f?.timeline||"")?r.f.timeline:addD(r.date,7)});
  }
  for(const q of S.equipment){if(q.active===false)continue;const li=lastInsp(q);if(li&&eqOk(q)===false)out.push({id:`eq_${q.id}_${li.date}`,eqId:q.id,date:li.date,kind:"معدات",title:`${EQ_K[q.kind]?.one||""} ${q.serial||q.code||q.name||""} غير صالح`,detail:Object.entries(li.res||{}).filter(([,v])=>v==="nok").map(([k])=>(EQ_K[q.kind].checks.find(c=>c[0]===k)||[k,k])[1]).join("، ")+(li.notes?" · "+li.notes:""),place:q.place||"",due:addD(li.date,3),auto:true})}
  const T=new Map(S.actions.map(a=>[a.id,a]));const res=[];
  for(const d of out){const tr=T.get(d.id)||{};T.delete(d.id);res.push({...d,...tr,id:d.id,derived:true})}
  for(const a of T.values())if(a.manual)res.push(a);
  return res.map(a=>({...a,status:a.status||"open",late:(a.status||"open")!=="closed"&&a.due&&a.due<today()}));
}

function compose(cards,perPage,landscape){const W=landscape?1754:1241,H=landscape?1241:1754;const out=[];
  for(let i=0;i<cards.length;i+=perPage){const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
    cards.slice(i,i+perPage).forEach((cv,j)=>{const cols=perPage===4?2:1,rows=perPage===1?1:2;const cw=W/cols,ch=H/rows;const s=Math.min(cw/cv.width,ch/cv.height)*0.97;const w=cv.width*s,h=cv.height*s;
      const col=perPage===4?(1-(j%2)):0;g.drawImage(cv,col*cw+(cw-w)/2,Math.floor(j/cols)*ch+(ch-h)/2,w,h)});out.push(c)}return out}
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o.length?o:[[]]};

/* ---------- KPI ---------- */
function kpiTargets(){const t=S.settings.targets||{};const o={};for(const k of KPIS)o[k.k]=num(t[k.k])||k.def;return o}
function kpiAuto(empId,month){
  const o={inspection:0,unsafeCond:0,unsafeActs:0,corrective:0,tbt:0};const e=emp(empId);const nm=e?normName(e.name):"#";
  const by=(r,...ks)=>ks.some(k=>r.f?.[k+"_id"]===empId||(r.f?.[k]&&normName(r.f[k])===nm));
  for(const r of S.records){if(!(r.date||"").startsWith(month))continue;
    if(CHECKLIST_FORMS.includes(r.form)&&by(r,"officer"))o.inspection++;
    if(r.form==="F-HSE-07-03"&&by(r,"reporter"))for(const x of r.rows||[]){if(x?.kind==="USC")o.unsafeCond++;else if(x?.kind==="USA")o.unsafeActs++}
    if(r.form==="F-HSE-07-01"&&by(r,"writer","officer"))o.unsafeActs++;
    if((r.form==="F-HSE-24-02"&&by(r,"trainer"))||(r.form==="F-HSE-24-01"&&by(r,"lecturer")))o.tbt++;}
  for(const q of S.equipment)for(const h of q.insp||[])if((h.date||"").startsWith(month)&&(h.by_id===empId||normName(h.by||"")===nm))o.inspection++;
  for(const a of S.actions)if(a.status==="closed"&&(a.closedAt||"").startsWith(month)&&a.closedBy===empId)o.corrective++;
  return o;
}
function kpiSummary(month){
  const T=kpiTargets();
  return hseTeam().map(e=>{
    const E=S.kpi.filter(x=>x.empId===e.id&&(x.date||"").startsWith(month));const AU=kpiAuto(e.id,month);
    const sums={};for(const k of KPIS)sums[k.k]=E.reduce((a,x)=>a+num(x[k.k]),0)+(AU[k.k]||0);const autoN=Object.values(AU).reduce((a,b)=>a+b,0);
    const ach=KPIS.map(k=>Math.min(150,T[k.k]?sums[k.k]/T[k.k]*100:0));
    const score=Math.round(ach.reduce((a,b)=>a+b,0)/KPIS.length);
    return {id:e.id,name:e.name,sums,entries:E.length+autoN,auto:AU,score};
  }).filter(r=>r.entries>0).sort((a,b)=>b.score-a.score);
}

/* ---------- Monthly report ---------- */
function monthReport(m){
  const P=S.permits.filter(p=>(p.date||"").startsWith(m));
  const byType=Object.keys(PTW_TYPES).map(t=>[t,P.filter(p=>p.type===t).length]).filter(x=>x[1]);
  const byStatus=Object.keys(PTW_STATUS).map(s=>[s,P.filter(p=>p.status===s).length]).filter(x=>x[1]);
  const M=S.moves.filter(x=>(x.date||"").startsWith(m)&&x.type==="issue");
  const byItem={};for(const x of M)byItem[x.itemId]=(byItem[x.itemId]||0)+num(x.qty);
  const topItems=Object.entries(byItem).sort((a,b)=>b[1]-a[1]);
  const days=S.att.filter(a=>(a.id||"").startsWith(m));
  const att={};for(const d of days)for(const [eid,r] of Object.entries(d.records||{})){(att[eid]??={p:0,a:0,v:0,m:0,e:0});if(r.s)att[eid][r.s]++}
  const K=kpiSummary(m);
  return {P,byType,byStatus,M,topItems,days,att,K};
}

        if(col.type==="check"){const sel=Array.isArray(v)?v:(v?[v]:[]);for(const o of sel)if(cells[col.k][o])tick(cells[col.k][o]);if(sel.length)any=true;continue}
        if((v==null||v==="")&&col.auto){const [src,attr]=col.auto.split(".");const e=empById(row[src+"_id"]);v=e?e[attr]:""}
        if(v){any=true;text(col.type==="date"&&/^\d{4}-\d\d-\d\d$/.test(v)?fmtDate(v):v,cells[col.k],{fill:col.fill,lines:col.type==="textarea"?(col.lines||3):1})}}
      if(any&&R.num&&cells.__num)text(String(i+1),cells.__num);
    })}
    out.push(c);
  }
  return out;
}
VIEWS.forms={
  shell:()=>`<div class="head"><h2 class="grow">النماذج والسجلات</h2></div><div id="formsBody"></div>`,
  async fill(){
    const el=$("formsBody");let F2;try{F2=await loadForms2()}catch(e){el.innerHTML='<div class="msg">معرفتش أحمّل النماذج.</div>';return}
    if(ui.formSel&&F2[ui.formSel])return fillFormRecords(el,ui.formSel,F2[ui.formSel]);
    const byG={};for(const [fid,s] of Object.entries(F2))(byG[s.group]??=[]).push([fid,s]);
    el.innerHTML=Object.entries(FORM_GROUPS).filter(([g])=>byG[g]).map(([g,gl])=>`<h3 style="margin-top:6px">${gl}</h3><div class="grid g4" style="margin-bottom:18px">${byG[g].sort().map(([fid,s])=>{const n=recsOf(fid).length;return `<button class="card tile" style="text-align:right;cursor:pointer;font:inherit;color:inherit" onclick="ui.formSel='${fid}';refresh()"><span class="lbl num" style="direction:ltr;text-align:right">${fid}</span><span style="font-weight:600;font-size:15px">${esc(s.title)}</span><span class="note">${n?n+" سجل":"لسه مفيش سجلات"}</span></button>`}).join("")}</div>`).join("");
  }
};
function fillFormRecords(el,fid,spec){
  const L=recsOf(fid).filter(mineRec);
  const sum=r=>{const keys=spec.fields.filter(f=>!f.hidden&&f.type!=="check"&&f.k!=="date"&&!f.default&&!f.auto).slice(0,2).map(f=>recVal(spec,r,f.k)).filter(Boolean);const rows=(r.rows||[]).filter(x=>x&&Object.values(x).some(v=>v&&v.length));return [keys.join(" · "),rows.length?`${rows.length} ${spec.rows?.label||"صف"}`:""].filter(Boolean).join(" — ")};
  el.innerHTML=`<div class="filters"><button class="btn" onclick="ui.formSel='';refresh()">→ كل النماذج</button><div class="grow"></div><button class="btn primary" onclick="recordForm('${fid}')">+ ${esc(spec.title)} جديد</button></div>
  <div class="card"><h3><span class="num">${fid}</span> · ${esc(spec.title)}</h3>
  ${L.length?`<div class="list">${L.map(r=>`<div class="li"><span class="num">${r.serial||""}</span><div class="grow"><div class="t">${fmtDate(r.date)}</div><div class="s">${esc(sum(r))}</div></div><div class="row-actions"><button class="btn ghost sm" onclick="printRecord('${r.id}')">طباعة</button>${attBtn("records",r.id,r)}<button class="btn ghost sm" onclick="recordForm('${fid}','${r.id}')">تعديل</button>${canDelete?`<button class="btn ghost sm danger" onclick="recordDel('${r.id}')">مسح</button>`:""}</div></div>`).join("")}</div>`:emptyState("لسه مفيش سجلات","سجّل أول واحد، والنموذج الرسمي هيتفتح للطباعة بعد الحفظ.")}</div>`;
}
async function recordForm(fid,id,preset){
  const spec=(await loadForms2())[fid];const rec=id?S.records.find(r=>r.id===id):{f:{},rows:[],...(preset||{})};
  const fv=k=>rec.f?.[k]??"";
  const fieldHTML=f=>{
    if(f.hidden)return "";
    const lab=esc(f.label||f.k),id="rf_"+f.k;
    if(f.type==="check"){const sel=Array.isArray(fv(f.k))?fv(f.k):[fv(f.k)];const labels=f.optLabels||{};
      return `<div class="field full"><label>${lab}</label><div style="display:flex;flex-wrap:wrap;gap:6px 14px">${Object.keys(f.opts).map(o=>`<label style="display:flex;gap:6px;align-items:center;font-size:13.5px"><input type="${f.multi?"checkbox":"radio"}" name="${f.k}" value="${esc(o)}" ${sel.includes(o)?"checked":""}> ${esc(labels[o]||o)}</label>`).join("")}</div></div>`}
    if(f.type==="textarea")return `<div class="field full"><label for="${id}">${lab}</label><textarea id="${id}" name="${f.k}" rows="${Math.min(6,f.lines||3)}">${esc(fv(f.k))}</textarea></div>`;
    if(f.type==="emp")return `<div class="field"><label for="${id}">${lab}</label><input id="${id}" name="${f.k}" list="empListAll" autocomplete="off" value="${esc(fv(f.k))}" placeholder="اكتب الاسم أو الكود"></div>`;
    const type=f.type==="date"?"date":f.type==="time"?"time":"text";
    const val=fv(f.k)||(f.type==="date"&&f.k==="date"?today():"");
    return `<div class="field"><label for="${id}">${lab}</label><input id="${id}" type="${type}" name="${f.k}" value="${esc(val)}" placeholder="${esc(f.default||(f.auto?"تلقائي":""))}"></div>`;
  };
  const R=spec.rows;
  const rowsHTML=R?`<div class="full"><div style="display:flex;align-items:center;gap:10px;margin:8px 0"><h3 style="margin:0" class="grow">${esc(R.label||"الجدول")}${R.items?"":` (لحد ${R.n})`}</h3>${R.items?`<button type="button" class="btn sm" onclick="this.closest('form').querySelectorAll('input[type=radio][value=ok]').forEach(i=>i.checked=true)">الكل مطابق</button>`:""}</div><div style="overflow-x:auto"><table><thead><tr><th>${R.items?"البند":"#"}</th>${R.cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>
    ${Array.from({length:R.n},(_,i)=>{const row=(rec.rows||[])[i]||{};return `<tr><td ${R.items?'style="min-width:220px;font-size:13px"':'class="n"'}>${R.items?esc(R.items[i]||""):i+1}</td>${R.cols.map(c=>{const nm=`r${i}_${c.k}`;
      if(c.type==="check"){const sel=Array.isArray(row[c.k])?row[c.k]:[row[c.k]];const ol=c.optLabels||{};return `<td style="${c.multi?"min-width:220px":"white-space:nowrap"}">${(c.opts||[]).map(o=>`<label style="font-size:12px;margin-inline-end:8px;white-space:nowrap;display:inline-block"><input type="${c.multi?"checkbox":"radio"}" name="${nm}" value="${esc(o)}" ${sel.includes(o)?"checked":""}> ${esc(ol[o]||o)}</label>`).join("")}</td>`}
      if(c.type==="textarea")return `<td><textarea name="${nm}" rows="2" style="min-width:180px">${esc(row[c.k]||"")}</textarea></td>`;
      if(c.auto)return `<td><input name="${nm}" value="${esc(row[c.k]||"")}" placeholder="تلقائي" style="min-width:110px"></td>`;
      if(c.type==="select")return `<td><select name="${nm}" style="min-width:56px">${(c.choices||[]).map(o=>`<option value="${esc(o)}" ${String(row[c.k]||"")===o?"selected":""}>${esc(o||"—")}</option>`).join("")}</select></td>`;
      if(c.type==="date")return `<td><input type="date" name="${nm}" value="${esc(row[c.k]||"")}" style="min-width:130px"></td>`;
      return `<td><input name="${nm}" ${c.type==="emp"?'list="empListAll" autocomplete="off"':""} ${c.type==="time"?'type="time"':""} value="${esc(row[c.k]||"")}" style="min-width:${c.type==="emp"?180:100}px"></td>`}).join("")}</tr>`}).join("")}
    </tbody></table></div></div>`:"";
  let photos=(rec.att||[]).filter(a=>a.kind==="photo");const removed=[];
  const photoHTML=`<div class="full" style="margin-top:6px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><h3 style="margin:0" class="grow">📷 ${esc(PHOTO_LABEL(fid))}</h3>${assetsNS?`<label class="btn sm primary" style="cursor:pointer">+ صورة<input type="file" id="rfPhoto" accept="image/*" multiple style="display:none"></label>`:""}</div><div id="rfPhotos" style="display:flex;flex-wrap:wrap;gap:8px"></div><div id="rfPhotoMsg" class="muted" style="font-size:12.5px;margin-top:6px">${assetsNS?"الصور هتطلع في صفحة مرفقة بعد النموذج في الطباعة.":"رفع الصور متاح لصاحب المنظومة واللي معاه صلاحية تعديل."}</div></div>`;
  openSheet((id?"تعديل ":"")+spec.title,`<div class="form">${spec.fields.map(fieldHTML).join("")}${rowsHTML}${photoHTML}</div>${empDatalist2()}`,async(fd,form)=>{
    const data={form:fid,f:{},rows:[],updatedAt:Date.now()};
    data.att=[...(rec.att||[]).filter(a=>a.kind!=="photo"),...photos];
    for(const f of spec.fields){if(f.hidden)continue;
      if(f.type==="check"){const v=[...form.querySelectorAll(`[name="${f.k}"]:checked`)].map(i=>i.value);data.f[f.k]=f.multi?v:(v[0]||"")}
      else{const v=(fd[f.k]||"").trim();data.f[f.k]=v;if(f.type==="emp"){const e=resolveEmp(v);if(e){data.f[f.k+"_id"]=e.id;data.f[f.k]=e.name}}}}
    if(R){for(let i=0;i<R.n;i++){const row={};let any=false;for(const c of R.cols){const nm=`r${i}_${c.k}`;
      if(c.type==="check"){if(c.multi){row[c.k]=[...form.querySelectorAll(`[name="${nm}"]:checked`)].map(i=>i.value);if(row[c.k].length)any=true}else{const ch=form.querySelector(`[name="${nm}"]:checked`);row[c.k]=ch?ch.value:"";if(row[c.k])any=true}}
      else{const v=(fd[nm]||"").trim();row[c.k]=v;if(v)any=true;if(c.type==="emp"&&v){const e=resolveEmp(v);if(e){row[c.k+"_id"]=e.id;row[c.k]=e.name}}}}
      data.rows.push(any?row:null)}
      while(data.rows.length&&!data.rows[data.rows.length-1])data.rows.pop()}
    data.date=data.f.date||today();
    let rid=id;
    const ok=await write(async()=>{if(id)await upsert("records",id,data);else{data.serial=nextRecSerial(fid);data.createdAt=Date.now();data.createdBy=ME.id||"";const ref=await db.collection("records").add(data);rid=ref.id}},"اتحفظ");
    if(ok){for(const a of removed){try{await assetsNS?.delete(a)}catch(e){}}}
    if(ok&&rid)setTimeout(()=>printRecord(rid),400);
    return ok?null:"الحفظ فشل";
  },"حفظ وطباعة");
  const drawP=()=>{const b=$("rfPhotos");if(!b)return;b.innerHTML=photos.length?photos.map(a=>`<div style="position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line,#ddd)"><img src="/_blob/${a.a}" alt="" style="width:100%;height:100%;object-fit:cover"><button type="button" data-rm="${a.a}" aria-label="شيل الصورة" style="position:absolute;top:3px;left:3px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer">✕</button></div>`).join(""):`<span class="muted" style="font-size:13px">مفيش صور</span>`};
  drawP();
  $("rfPhotos")?.addEventListener("click",e=>{const x=e.target.closest("[data-rm]");if(!x)return;removed.push(x.dataset.rm);photos=photos.filter(a=>a.a!==x.dataset.rm);drawP()});
  $("rfPhoto")?.addEventListener("change",async e=>{const files=[...e.target.files];if(!files.length)return;const m=$("rfPhotoMsg");m.textContent=`بيرفع ${files.length} صورة…`;let bad=0;
    for(const f of files){try{const b=await shrinkImage(f);const r=await assetsNS.upload(b,b.type?undefined:{type:"image/jpeg"});photos.push({a:r.id,kind:"photo",type:r.contentType,at:Date.now()});drawP()}catch(err){bad++}}
    m.textContent=bad?`${bad} صورة مترفعتش (لازم JPG أو PNG، صور الآيفون HEIC حوّلها JPG)`:"اترفعت. اضغط «حفظ وطباعة» عشان تتسجل مع النموذج.";e.target.value=""});
}
function empDatalist2(){return `<datalist id="empListAll">${activeEmps().map(e=>`<option value="${esc(e.name+(e.code?" · "+e.code:""))}">${esc(e.job||"")}</option>`).join("")}</datalist>`}
async function printRecord(id){
  let r=S.records.find(x=>x.id===id);for(let i=0;!r&&i<10;i++){await new Promise(z=>setTimeout(z,200));r=S.records.find(x=>x.id===id)}
  if(!r){toast("السجل مش موجود");return}
  const spec=(await loadForms2())[r.form];let pages=null;
  openSheet(`طباعة ${spec.title}`,`<div id="pvw" class="pvw"><div class="empty">بيجهّز النموذج…</div></div>`,async()=>{
    if(!pages)return "النموذج لسه بيجهز";const dl=await window.claude?.use?.("downloads");if(!dl)return "التنزيل مش متاح هنا. حدّث الصفحة";
    let blob;try{blob=await permitPdfBlob(pages)}catch(e){return "معرفتش أعمل ملف PDF"}
    try{await dl.save({filename:`${r.form} ${r.date||""}.pdf`,data:blob});toast("اتنزل الملف")}catch(e){if(e?.code==="declined")return "التنزيل اتلغى";return "التنزيل مش متاح هنا"}
    return null},"تنزيل PDF للطباعة");
  try{pages=[...await renderGeneric(r.form,r),...await photoPages(r,spec.title)];const b=$("pvw");if(b){b.innerHTML="";pages.forEach(c=>b.appendChild(c))}}catch(e){console.error(e);const b=$("pvw");if(b)b.innerHTML='<div class="msg">معرفتش أحمّل النموذج.</div>'}
}
function recordDel(id){confirmSheet("مسح السجل","السجل هيتمسح نهائياً.",()=>write(()=>remove("records",id),"اتمسح"))}

show(tab);
