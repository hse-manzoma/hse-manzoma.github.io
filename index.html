<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#D9480F"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="منظومة السلامة"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>منظومة السلامة HSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
</head><body>
<style>
html,body{margin:0}
/* Layout: sticky header + tab rail, one working surface per tab; tables scroll inside their own box */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#15211C; --muted:#5A6B63; --line:#D3DCD8;
  --accent:#D9480F; --accent-ink:#FFFFFF; --accent-soft:#FBE3D6;
  --ok:#2B7A4B; --ok-soft:#DDF0E4; --warn:#A86A0B; --warn-soft:#F8EBCF; --bad:#B42318; --bad-soft:#F9DEDB; --info:#1F5E9C; --info-soft:#DCE8F5;
  --t-hot:#C2410C; --t-cold:#1D5FA8; --t-height:#B7791F; --t-lift:#6B4FA0; --t-conf:#0F766E; --t-elec:#A61E4D; --t-exc:#6B5B45;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2824; --ink:#E4ECE8; --muted:#93A59C; --line:#2B3833;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --accent-soft:#3A2116;
  --ok:#5CC48A; --ok-soft:#173527; --warn:#E9B04F; --warn-soft:#3A2D12; --bad:#F2776B; --bad-soft:#3D1C19; --info:#7FB2E8; --info-soft:#18293B;
  --t-hot:#FF8A4C; --t-cold:#6FA8EA; --t-height:#E9B04F; --t-lift:#B39AE6; --t-conf:#4CC7BA; --t-elec:#F27BA3; --t-exc:#C8B79A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1B; --sunk:#1D2824; --ink:#E4ECE8; --muted:#93A59C; --line:#2B3833;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --accent-soft:#3A2116;
  --ok:#5CC48A; --ok-soft:#173527; --warn:#E9B04F; --warn-soft:#3A2D12; --bad:#F2776B; --bad-soft:#3D1C19; --info:#7FB2E8; --info-soft:#18293B;
  --t-hot:#FF8A4C; --t-cold:#6FA8EA; --t-height:#E9B04F; --t-lift:#B39AE6; --t-conf:#4CC7BA; --t-elec:#F27BA3; --t-exc:#C8B79A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{direction:rtl;min-height:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand h1{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;letter-spacing:0;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.sync{margin-inline-start:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:600 14px var(--f-body);color:var(--muted);background:none;border:0;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:15.5px;font-weight:600;margin:0 0 10px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head .grow{flex:1}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipbtn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn.sm{font-size:12.5px;padding:5px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
.filters input[type=search]{flex:1 1 200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tile{display:flex;flex-direction:column;gap:4px}
.tile .lbl{color:var(--muted);font-size:13px}
.tile .val{font:600 30px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.tile .note{font-size:12.5px;color:var(--muted)}
.tile.alert .val{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px;text-align:right;padding:9px 10px;background:var(--sunk);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.num{font-family:var(--f-num);font-size:13px;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-open{background:var(--info-soft);color:var(--info)} .p-appr{background:var(--ok-soft);color:var(--ok)}
.p-susp{background:var(--warn-soft);color:var(--warn)} .p-closed{background:var(--sunk);color:var(--muted)} .p-canc{background:var(--bad-soft);color:var(--bad)}
.type{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.type i{width:10px;height:10px;border-radius:2px;display:inline-block}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:16px;margin-bottom:4px}
.row-actions{display:flex;gap:2px;justify-content:flex-end;flex-wrap:nowrap}
.stock-low{color:var(--bad);font-weight:600}
.bar-meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:70px}
.bar-meter span{display:block;height:100%;background:var(--accent)}
.bar-meter span.ok{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 12.5px var(--f-body);border:0;background:var(--surface);color:var(--muted);padding:6px 10px;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"].s-p{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].s-a{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].s-v{background:var(--info-soft);color:var(--info)}
.seg button[aria-pressed="true"].s-m{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"].s-e{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:flex;justify-content:flex-start}
.sheet{direction:rtl;background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sheet .head{margin-bottom:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.serial{font:600 22px var(--f-num);direction:ltr;color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:end}
.msg{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad)}
.msg.okm{background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;direction:rtl}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13.5px}
[hidden]{display:none!important}
.grid .full{grid-column:1/-1}
.kpi-target{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
.pvw canvas{width:100%;height:auto;display:block;border:1px solid var(--line);margin-bottom:10px;background:#fff}
.report-text{white-space:pre-wrap;font-size:13px;background:var(--sunk);padding:12px;border-radius:8px;max-height:280px;overflow:auto}
@media (max-width:620px){
  .form{grid-template-columns:1fr}
  .brand small{display:none}
  .tile .val{font-size:26px}
}
/* ===== v2: viewer, dashboard, workflow, docs, mobile ===== */
.pvov{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.72);display:flex;flex-direction:column;direction:rtl}
.pvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.pvbar h2{font-size:16px;flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvnote{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 14px}
.pvnote.ok{background:var(--ok-soft);color:var(--ok)}
.pvbody{flex:1;overflow:auto;padding:16px 12px calc(30px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.pvbody canvas{display:block;width:100%;max-width:880px;height:auto;margin:0 auto 14px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);cursor:zoom-in}
.pvbody.zoom canvas{max-width:none;width:200%;cursor:zoom-out}
.pvbody .pgscale{margin:0 auto 14px;box-shadow:0 4px 18px rgba(0,0,0,.35);background:#fff;overflow:hidden;position:relative}
.pvbody .pgscale>.dpage{transform-origin:top right;position:absolute;top:0;right:0}
.pvcount{color:#fff;opacity:.8;font-size:12.5px;text-align:center;margin:-6px 0 12px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sign{background:#1f4f8f;border-color:#1f4f8f;color:#fff}
.pill.p-sign{background:#dfe9f7;color:#1f4f8f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.p-sign{background:#18293B;color:#7FB2E8}}

/* dashboard */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#B5370A 100%);color:#fff;border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{color:#fff;font-size:21px}
.hero .sub2{opacity:.88;font-size:13.5px;margin-top:2px}
.hero .qa{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero .qa .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff}
.hero .qa .btn:hover{background:rgba(255,255,255,.26)}
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:right;font:inherit;color:inherit;cursor:pointer}
.kcard:hover{border-color:var(--muted)}
.kcard .kl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kcard .kv{font:700 26px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.15}
.kcard .kn{font-size:12px;color:var(--muted)}
.kcard.bad .kv{color:var(--bad)} .kcard.good .kv{color:var(--ok)}
.kcard .ki{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.dgrid .card h3{display:flex;align-items:center;gap:8px}
.dgrid .card h3 .grow{flex:1}
.grade{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font:700 13px var(--f-display);color:#fff;background:var(--ok);flex:none}
.grade.B{background:var(--warn)} .grade.C{background:var(--bad)} .grade.N{background:var(--muted)}
.reqrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.reqrow:first-child{border-top:0}
.reqrow .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.st.done{background:var(--ok-soft);color:var(--ok)} .st.late{background:var(--bad-soft);color:var(--bad)} .st.soon{background:var(--warn-soft);color:var(--warn)} .st.wait{background:var(--sunk);color:var(--muted)}
.cdown{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cdown .big{font:700 34px var(--f-display);color:var(--accent);line-height:1}
.flowsteps{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.flowsteps span{padding:1px 7px;border-radius:999px;background:var(--sunk)}
.flowsteps span.on{background:var(--ok-soft);color:var(--ok);font-weight:600}
.flowsteps span.cur{background:var(--warn-soft);color:var(--warn);font-weight:600}
.flowsteps span.no{background:var(--bad-soft);color:var(--bad);font-weight:600}
.inbox{border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--surface)}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:13px 16px;font:600 15px var(--f-display);list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"◂";color:var(--muted);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(-90deg)}
details.sec>.in{padding:0 16px 16px;overflow-x:auto}
.mini{width:84px} .mini2{width:120px}
table.ed{width:100%;border-collapse:collapse;font-size:13.5px}
table.ed th{position:static}
table.ed td{padding:5px 6px}
table.ed input,table.ed textarea{width:100%}
.autov{font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}
.chk input{width:18px;height:18px;margin-top:2px;flex:none}
.docitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.docitem:first-child{border-top:0}
.docicon{width:40px;height:46px;border-radius:6px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font:700 11px var(--f-body);flex:none}
.docicon.img{background:var(--info-soft);color:var(--info)}

/* bottom nav + fab (mobile) */
#bnav,#fab{display:none}
@media (max-width:760px){
  body{font-size:15px}
  nav.tabs{display:none}
  .bar{padding-block:9px;gap:10px}
  .brand h1{font-size:16.5px}
  .mark{width:30px;height:30px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #bnav{display:flex;position:fixed;inset:auto 0 0 0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));direction:rtl;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  #bnav button{flex:1;background:none;border:0;color:var(--muted);font:600 11px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;cursor:pointer;min-width:0}
  #bnav button svg{width:22px;height:22px}
  #bnav button[aria-current="true"]{color:var(--accent)}
  #bnav button[aria-current="true"] .ic{background:var(--accent-soft);border-radius:999px}
  #bnav .ic{display:grid;place-items:center;width:46px;height:28px}
  #bnav .badge{position:absolute;margin-inline-start:22px;margin-top:-4px;background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
  #fab{display:flex;position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:14;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(217,72,15,.4);cursor:pointer}
  .head{gap:8px}
  .head h2{font-size:18px}
  .head .btn.primary{display:none}
  .head .btn.primary.keep{display:inline-flex}
  .btn{min-height:40px;padding:8px 13px}
  .btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
  .btn.ghost.sm{min-height:34px}
  input,select,textarea{font-size:16px;min-height:42px}
  input[type=checkbox],input[type=radio]{min-height:0}
  .filters{gap:6px}
  .filters input[type=search]{flex:1 1 100%}
  .sheet{width:100%;border-radius:0}
  .overlay{justify-content:stretch}
  .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .val{font-size:24px}
  .kstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kcard .kv{font-size:22px}
  .dgrid{grid-template-columns:1fr}
  .hero{padding:16px}
  .hero h2{font-size:18px}
  /* tables become cards */
  .tbl{border:0;background:none;overflow:visible}

/* ---------- state ---------- */

const loaded = {};
let assetsNS=null;const ME={id:"",name:""};

const ui = {actF:"open",actQ:"",eqKind:"ext",mpG:"",mpQ:"",mpCtr:"",personSel:"",personBack:"",ctrSel:"",empG:"",leaveMonth:thisMonth(),dutyMonth:thisMonth(),ptwQ:"",ptwType:"",ptwStatus:"",ptwMonth:"",ppeSub:"items",ppeQ:"",ppeMonth:thisMonth(),teamSub:"att",attDate:today(),empQ:"",kpiSub:"entry",kpiMonth:thisMonth(),repMonth:thisMonth()};

/* ---------- helpers ---------- */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}

function fmtDate(s){if(!s)return "";const [y,m,d]=s.split("-");return `${d}/${m}/${y}`}
function monthName(ym){const [y,m]=ym.split("-");const n=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"][+m-1];return `${n} ${y}`}
function num(v){const n=Number(v);return isFinite(n)?n:0}
function emp(id){return S.employees.find(e=>e.id===id)}
function empName(id){return emp(id)?.name||"—"}
function item(id){return S.items.find(i=>i.id===id)}
function hseTeam(){return S.employees.filter(e=>e.group==="hse"&&e.active!==false).sort((a,b)=>a.name.localeCompare(b.name,"ar"))}
function activeEmps(){return S.employees.filter(e=>e.active!==false).sort((a,b)=>a.name.localeCompare(b.name,"ar"))}
function typeChip(t){const T=PTW_TYPES[t]||{ar:t,c:"--muted"};return `<span class="type"><i style="background:var(${T.c})"></i>${esc(T.ar)}</span>`}
function statusPill(s){const p=PTW_STATUS[s]||[s,"p-closed"];return `<span class="pill ${p[1]}">${p[0]}</span>`}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
let _balRef=null,_bal=null;
function moveTotals(){if(_balRef!==S.moves){_bal={};for(const m of S.moves){const o=(_bal[m.itemId]??={inn:0,out:0});if(m.type==="receipt")o.inn+=num(m.qty);else o.out+=num(m.qty)}_balRef=S.moves}return _bal}
function balance(itemId){const it=item(itemId);const o=moveTotals()[itemId]||{inn:0,out:0};return num(it?.opening)+o.inn-o.out}
function nextSerial(type){
  const start = num(S.settings.serials?.[type]) || 1;
  let max = 0; for(const p of S.permits){ if(p.type===type) max=Math.max(max,num(p.serial)); }
  return Math.max(start, max+1);
}
function nextVoucher(){let m=0;for(const x of S.moves){if(x.voucher){const n=parseInt(String(x.voucher).replace(/\D/g,""));if(n>m)m=n}}return m+1}
function attDoc(date){return S.att.find(a=>a.id===date)}
function page(L,key,n=150){const lim=more[key]||n;return {rows:L.slice(0,lim),btn:L.length>lim?`<div style="text-align:center;margin-top:10px"><button class="btn sm" onclick="more['${key}']=${lim+n*2};refresh()">اعرض ${Math.min(n*2,L.length-lim)} كمان (من ${L.length})</button></div>`:""}}
function emptyState(title,body,btn){return `<div class="empty"><b>${title}</b>${body}${btn?`<div style="margin-top:12px">${btn}</div>`:""}</div>`}
function waiting(k){return (!loaded[k]||!legacyLoaded) && db ? `<div class="empty">بيحمّل…</div>` : ""}

/* ---------- data layer ---------- */
async function write(fn, okMsg){
  if(!db){toast("مفيش اتصال بقاعدة البيانات");return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    const c=e?.code;
    if(c==="invalid_argument"){canWrite=false;toast("مش مسموح لك تعدّل البيانات دي")}
    else if(c==="quota_exceeded"){toast("المساحة اتملت، امسح بيانات قديمة")}
    else toast("الحفظ فشل، جرّب تاني");
    console.error(e);return false
  }
}
let LEG={},legacyLoaded=false;const LIVE={};
function merge(k){const live=LIVE[k]||[];const leg=LEG[k]||[];if(!leg.length){S[k]=live.filter(x=>!x._deleted);return}
  const ids=new Map(live.map(x=>[x.id,x]));const out=[];for(const r of leg){const o=ids.get(r.id);if(o){ids.delete(r.id);if(!o._deleted)out.push(o)}else out.push(r)}for(const o of ids.values())if(!o._deleted)out.push(o);S[k]=out}
function current(col,id){const k=Object.keys(COLS).find(x=>COLS[x]===col);return (S[k]||[]).find(x=>x.id===id)}
async function upsert(col,id,data){const cur=current(col,id)||{};const {id:_,...rest}=cur;await db.doc(col+"/"+id).set({...rest,...data})}
async function remove(col,id){const k=Object.keys(COLS).find(x=>COLS[x]===col);if((LEG[k]||[]).some(r=>r.id===id))await db.doc(col+"/"+id).set({_deleted:true});else await db.doc(col+"/"+id).delete()}
const COLS={actions:"actions",tasks:"tasks",equipment:"equipment",contractors:"contractors",records:"records",employees:"employees",items:"ppe_items",moves:"ppe_moves",permits:"permits",kpi:"kpi_entries",att:"attendance",leaves:"leaves"};
async function boot(){
  setSync("بيتصل…","");
  if(!window.claude?.use){booted=true;setSync("مش متصل","off");show(tab);return}
  db = await window.claude.use("db");
  userNS = await window.claude.use("user");
  window.claude.use("assets").then(a=>{assetsNS=a;if(a)refresh()}).catch(()=>{});
  try{ME.id=(await userNS?.id())||"";ME.name=(await userNS?.name())||"";const mb=document.getElementById("meBtn");if(mb)mb.textContent="👤 "+ME.name}catch(e){}
  booted=true;
  if(!db){setSync("مش متصل","off");show(tab);return}
  try{canDelete = await userNS?.canEdit() ?? false; isOwner = await userNS?.isOwner() ?? false}catch(e){}
  try{const w=await userNS?.can("data.write"); if(w===false) canWrite=false}catch(e){}
  BASE={del:canDelete,write:canWrite};
  setSync("متصل","on"); online=true;
  for(const [k,p] of Object.entries(COLS)){
    db.collection(p).onSnapshot(s=>{LIVE[k]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[k]=true;merge(k);refresh()},()=>setSync("الاتصال اتقطع","off"));
  }
  db.collection("legacy").onSnapshot(s=>{const acc={};for(const d of s.docs){const x=d.data();(acc[x.kind]??=[]).push(...(x.rows||[]))}LEG=acc;legacyLoaded=true;for(const k of Object.keys(COLS))merge(k);refresh()},()=>{});
  db.collection("__profiles").onSnapshot(s=>{S.profiles=s.docs.map(d=>({id:d.id,...d.data()}));const me=S.profiles.find(p=>p.id===ME.id);if(me){window.SBA.profile=me;if(me.disabled){location.reload()}}applyRole();if(tab==="settings")refresh()},()=>{});
  db.collection("members").onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="settings")refresh()},()=>{});
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};loaded.settings=true;applyRole();document.getElementById("projectName").textContent="HSE · "+(S.settings.project||"المشروع");refresh()},()=>{});
  show(tab);
}

  VIEWS[tab].bind?.(m);

function $(id){return document.getElementById(id)}

/* ---------- sheet (side form) ---------- */
function openSheet(title,body,onSave,saveLabel="حفظ"){
  const root=$("overlayRoot");
  root.innerHTML=`<div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="head"><h2 class="grow">${esc(title)}</h2><button class="btn ghost" id="shClose" aria-label="إغلاق">✕</button></div>
    <form id="shForm">${body}<div id="shMsg"></div>
    <div style="display:flex;gap:8px;margin-top:18px"><button class="btn primary" type="submit" ${!canWrite?"disabled":""}>${esc(saveLabel)}</button><button class="btn" type="button" id="shCancel">إلغاء</button></div></form></div></div>`;
  const close=()=>{root.innerHTML=""};
  $("shClose").onclick=close;$("shCancel").onclick=close;
  $("ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  $("shForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const fd=Object.fromEntries(new FormData(e.target).entries());
    const err=await onSave(fd,e.target);
    if(err){$("shMsg").innerHTML=`<div class="msg" style="margin-top:12px">${esc(err)}</div>`;return}
    close();
  });
  setTimeout(()=>root.querySelector("input,select,textarea")?.focus(),30);
  return root;
}
function confirmSheet(title,text,onYes,yesLabel="امسح"){
  openSheet(title,`<p>${esc(text)}</p>`,async()=>{await onYes()},yesLabel);
}
function f(label,name,{type="text",value="",full=false,opts=null,req=false,attrs=""}={}){
  let input;
  if(opts) input=`<select name="${name}" id="f_${name}" ${req?"required":""} ${attrs}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
  else if(type==="textarea") input=`<textarea name="${name}" id="f_${name}" ${attrs}>${esc(value)}</textarea>`;
  else input=`<input type="${type}" name="${name}" id="f_${name}" value="${esc(value)}" ${req?"required":""} ${attrs}>`;
  return `<div class="field ${full?"full":""}"><label for="f_${name}">${label}</label>${input}</div>`;
}

  shell:()=>`<div class="head"><h2 class="grow">الرئيسية</h2><span class="muted">${fmtDate(today())}</span></div>
    <div id="dRem"></div><div class="grid g4" id="dTiles"></div>

      <div class="card"><h3>KPIs الشهر لفريق السلامة</h3><div id="dKpi"></div></div>
    </div>`,
  fill(){
    $("dRem").innerHTML=remindersHTML();
    {const al=allowedTabs()||[];const hide=(id,tabk)=>{const el=$(id)?.closest(".card");if(el)el.hidden=!al.includes(tabk)};hide("dPermits","ptw");hide("dTypes","ptw");hide("dLow","ppe");hide("dKpi","kpi");$("dTiles").hidden=!(al.includes("ptw")||al.includes("ppe")||al.includes("team"))}
    const m=thisMonth();

function resolveItem(txt){const s=String(txt||"").trim();if(!s)return null;const n=normName(s);
  let x=S.items.find(i=>itemLabel(i)===s)||S.items.find(i=>String(i.code)===s);if(x)return x;
  const m=S.items.filter(i=>normName(i.name).includes(n)||String(i.code).includes(s));return m.length===1?m[0]:(m.find(i=>normName(i.name)===n)||null)}
function resolveEmp(txt){const s=String(txt||"").trim();if(!s)return null;const n=normName(s);
  let x=S.employees.find(e=>e.name+(e.code?" · "+e.code:"")===s)||S.employees.find(e=>String(e.code)===s);if(x)return x;
  const m=S.employees.filter(e=>normName(e.name).includes(n));return m.length===1?m[0]:(m.find(e=>normName(e.name)===n)||null)}
function personHistoryHTML(e,full){
  if(!e)return full?`<div class="card">${emptyState("اكتب اسم الموظف أو كوده","هيظهرلك كل اللي استلمه من المخزن: التاريخ، والصنف، والكمية، وإجمالي كل صنف.")}</div>`:"";
  const L=S.moves.filter(m=>m.type==="issue"&&m.empId===e.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(!L.length)return full?`<div class="card">${emptyState(esc(e.name),"مستلمش أي حاجة من المخزن قبل كده.")}</div>`:`<p class="muted" style="font-size:12.5px;margin:4px 0 0">أول مرة يستلم من المخزن.</p>`;
  const tot={};for(const m of L){(tot[m.itemId]??={q:0,last:""});tot[m.itemId].q+=num(m.qty);if(!tot[m.itemId].last)tot[m.itemId].last=m.date}
  const rows=full?L:L.slice(0,8);
  const days=L[0].date?Math.round((new Date(today())-new Date(L[0].date))/864e5):null;
  return `<div class="card" style="${full?"":"padding:10px;margin-top:6px"}">
    <h3 style="margin-bottom:4px">${esc(e.name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(e.job||"")}${e.code?" · "+esc(e.code):""}</span></h3>
    <p class="muted" style="margin:0 0 8px;font-size:13px">استلم ${L.length} مرة · آخر استلام ${fmtDate(L[0].date)}${days!=null?` (من ${days} يوم)`:""}</p>
    ${full?`<div class="grid g2"><div><h3>الإجمالي لكل صنف</h3><div class="list">${Object.entries(tot).sort((a,b)=>b[1].q-a[1].q).map(([i,o])=>`<div class="li"><div class="grow"><div class="t">${esc(item(i)?.name||"صنف ممسوح")}</div><div class="s">آخر مرة ${fmtDate(o.last)}</div></div><span class="num">${o.q}</span></div>`).join("")}</div></div><div>`:""}
    <h3>${full?"كل التسليمات":"آخر التسليمات"}</h3>
    <div class="tbl" style="border:0"><table><thead><tr><th>التاريخ</th><th>الصنف</th><th class="n">الكمية</th>${full?"<th></th>":""}</tr></thead><tbody>
    ${rows.map(m=>`<tr><td class="n">${fmtDate(m.date)}</td><td>${esc(item(m.itemId)?.name||"صنف ممسوح")}</td><td class="n">${num(m.qty)}</td>${full?`<td><button class="btn ghost sm" onclick="printVoucher('${esc(voucherKey(m))}')">طباعة الإذن</button></td>`:""}</tr>`).join("")}</tbody></table></div>
    ${full?"</div></div>":(L.length>8?`<p class="muted" style="font-size:12px;margin:4px 0 0">و${L.length-8} تسليمات تانية في «استعلام عن موظف».</p>`:"")}</div>`;
}
function issueForm(){
  if(!S.items.length){toast("ضيف أصناف الأول");return}
  const MAX=4;
  const lineHTML=()=>`<div class="line"><div class="field"><label>الصنف (اكتب الاسم أو الكود)</label><input name="item" list="itemList" autocomplete="off" placeholder="مثلاً: جوانتي أو 2601020023"><small class="muted bal" style="font-size:12px"></small></div><div class="field"><label>الكمية</label><input type="number" name="qty" min="1" step="any" value="1"></div><button type="button" class="btn ghost" aria-label="شيل السطر" onclick="this.parentElement.remove();syncLines()">✕</button></div>`;
  openSheet("إذن صرف مهمات",`<div class="form">
    <div class="field"><label>رقم الإذن</label><div class="serial">IR-${nextVoucher()}</div></div>
    ${f("التاريخ","date",{type:"date",value:today(),req:true})}
    <div class="field full"><label for="f_emp">المستلم (اكتب الاسم أو الكود)</label><input id="f_emp" name="emp" list="empList" autocomplete="off" placeholder="اسم الموظف أو كوده"><small class="muted" id="empInfo" style="font-size:12px"></small><div id="empHist"></div></div>
    <div class="full"><div class="lines" id="lines">${lineHTML()}</div><button type="button" class="btn sm" id="addLine" style="margin-top:8px">+ صنف تاني</button> <span class="muted" style="font-size:12px">النموذج بياخد ${MAX} أصناف بالكتير</span></div>
    ${f("ملاحظات","note",{full:true})}</div>${itemDatalist()}${empDatalist(activeEmps())}`,
  async(fd,form)=>{
    const e=resolveEmp(fd.emp);if(!e)return "اختار المستلم من القايمة (اكتب جزء من الاسم أو الكود)";
    const raw=[...form.querySelectorAll(".line")].map(l=>({t:l.querySelector("[name=item]").value.trim(),qty:num(l.querySelector("[name=qty]").value)})).filter(l=>l.t);
    if(!raw.length)return "اكتب صنف واحد على الأقل";
    if(raw.length>MAX)return `الإذن بياخد ${MAX} أصناف بس`;
    const lines=[];for(const r of raw){const it=resolveItem(r.t);if(!it)return `الصنف «${r.t}» مش موجود أو فيه أكتر من صنف بنفس الكلام. اختار من القايمة`;if(r.qty<=0)return `اكتب كمية ${it.name}`;lines.push({itemId:it.id,qty:r.qty})}
    const need={};for(const l of lines)need[l.itemId]=(need[l.itemId]||0)+l.qty;
    for(const [iid,q] of Object.entries(need)){const b=balance(iid);if(q>b)return `الرصيد مش كفاية: ${item(iid).name} (المتاح ${b})`}
    const voucher="IR-"+nextVoucher();
    const ok=await write(async()=>{for(const l of lines){await db.collection("ppe_moves").add({type:"issue",voucher,itemId:l.itemId,qty:l.qty,empId:e.id,date:fd.date,note:fd.note.trim(),createdAt:Date.now()})}},`اتسجل إذن الصرف ${voucher}`);
    if(ok)setTimeout(()=>printVoucher(voucher),400);
    return ok?null:"الحفظ فشل";
  },"سجّل الإذن");
  window.syncLines=()=>{const n=$("lines").querySelectorAll(".line").length;$("addLine").hidden=n>=MAX};
  $("addLine").onclick=()=>{if($("lines").querySelectorAll(".line").length<MAX)$("lines").insertAdjacentHTML("beforeend",lineHTML());syncLines()};
  $("lines").addEventListener("input",ev=>{const inp=ev.target.closest("[name=item]");if(!inp)return;const it=resolveItem(inp.value);const e=resolveEmp($("f_emp").value);let warn="";
    if(it&&e){const last=S.moves.filter(m=>m.type==="issue"&&m.empId===e.id&&m.itemId===it.id).sort((x,y)=>(y.date||"").localeCompare(x.date||""))[0];if(last){const d=Math.round((new Date(today())-new Date(last.date))/864e5);warn=` · ⚠ استلم نفس الصنف ${fmtDate(last.date)} (من ${d} يوم)`}}
    const el=inp.parentElement.querySelector(".bal");el.textContent=it?`${it.name} · الرصيد المتاح ${balance(it.id)} ${it.unit||""}${warn}`:"";el.style.color=warn?"var(--warn)":""});
  $("f_emp").addEventListener("input",ev=>{const e=resolveEmp(ev.target.value);$("empInfo").textContent=e?`${e.name} · ${e.job||""} · ${e.code||""}`:"";$("empHist").innerHTML=personHistoryHTML(e,false)});
}
function receiptForm(){
  if(!S.items.length){toast("ضيف أصناف الأول");return}
  openSheet("استلام مخزن (إضافة رصيد)",`<div class="form">
    <div class="field full"><label for="f_it">الصنف (اكتب الاسم أو الكود)</label><input id="f_it" name="it" list="itemList" autocomplete="off" required><small class="muted" id="itInfo" style="font-size:12px"></small></div>
    ${f("الكمية","qty",{type:"number",value:"",req:true,attrs:'min="1" step="any"'})}
    ${f("التاريخ","date",{type:"date",value:today(),req:true})}
    ${f("ملاحظات (المورد، رقم الفاتورة)","note",{full:true})}</div>${itemDatalist()}`,
  async fd=>{
    const it=resolveItem(fd.it);if(!it)return "اختار الصنف من القايمة";if(num(fd.qty)<=0)return "اكتب الكمية";
    const ok=await write(()=>db.collection("ppe_moves").add({type:"receipt",itemId:it.id,qty:num(fd.qty),date:fd.date,note:fd.note.trim(),createdAt:Date.now()}),"اتضاف للرصيد");
    return ok?null:"الحفظ فشل";
  },"سجّل الاستلام");
  $("f_it").addEventListener("input",ev=>{const it=resolveItem(ev.target.value);$("itInfo").textContent=it?`الرصيد الحالي ${balance(it.id)} ${it.unit||""}`:""});
}

/* ---------- TEAM ---------- */
function daysBetween(a,b){if(!a||!b)return 1;const d=(new Date(b)-new Date(a))/864e5;return Math.max(1,Math.round(d)+1)}
VIEWS.team = {
  shell:()=>`<div class="head"><h2 class="grow">التيم والحضور</h2></div>
    <div class="sub">
      <button class="chipbtn" data-sub="att" aria-pressed="${ui.teamSub==="att"}">الحضور اليومي</button>
      <button class="chipbtn" data-sub="leaves" aria-pressed="${ui.teamSub==="leaves"}">الإجازات والأرصدة</button>
      <button class="chipbtn" data-sub="duties" aria-pressed="${ui.teamSub==="duties"}">تيم ديوتي ومأموريات وأذونات</button>
      <button class="chipbtn" data-sub="emps" aria-pressed="${ui.teamSub==="emps"}">الموظفين</button>
    </div>
    <div class="filters" id="teamFilters"></div><div id="teamBody"></div>`,
  bind(m){
    m.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{ui.teamSub=b.dataset.sub;show("team")});
    const F=$("teamFilters");
    if(ui.teamSub==="att"){
      F.innerHTML=`<input type="date" id="attDate" value="${ui.attDate}" aria-label="اليوم"><button class="btn" id="allP">الكل حاضر</button><span class="muted" style="align-self:center;font-size:13px" id="attSum"></span>`;
      $("attDate").onchange=e=>{ui.attDate=e.target.value||today();this.fill()};
      $("allP").onclick=()=>{const recs={};for(const e of attTeam()){recs[e.id]={s:attDoc(ui.attDate)?.records?.[e.id]?.s||"p"}}saveAtt(ui.attDate,recs,true)};
    } else if(ui.teamSub==="leaves"){
      F.innerHTML=`<input type="month" id="leaveMonth" value="${ui.leaveMonth}" aria-label="الشهر"><button class="btn primary" id="addLeave">+ إجازة</button>`;
      $("leaveMonth").onchange=e=>{ui.leaveMonth=e.target.value||thisMonth();this.fill()};
      $("addLeave").onclick=()=>leaveForm();
    } else if(ui.teamSub==="duties"){
      F.innerHTML=`<input type="month" id="dutyMonth" value="${ui.dutyMonth}" aria-label="الشهر"><button class="btn primary" id="addDuty">+ تسجيل جديد</button>`;
      $("dutyMonth").onchange=e=>{ui.dutyMonth=e.target.value||thisMonth();this.fill()};
      $("addDuty").onclick=()=>dutyForm();
    } else {
      F.innerHTML=`<input type="search" id="empQ" placeholder="ابحث بالاسم أو الكود أو الوظيفة" value="${esc(ui.empQ)}"><select id="empG"><option value="">كل المجموعات</option>${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}" ${ui.empG===k?"selected":""}>${v}</option>`).join("")}<option value="ptw" ${ui.empG==="ptw"?"selected":""}>معتمدين التصاريح</option></select><button class="btn primary" id="addEmp">+ موظف</button><button class="btn" id="impEmp">لصق من Excel</button>`;
      $("empQ").oninput=e=>{ui.empQ=e.target.value;more.emps=0;this.fill()};
      $("empG").onchange=e=>{ui.empG=e.target.value;this.fill()};
      $("addEmp").onclick=()=>empForm();$("impEmp").onclick=()=>importForm("employees");
    }
  },
  fill(){
    const el=$("teamBody");
    if(waiting("employees")){el.innerHTML=waiting("employees");return}
    if(ui.teamSub==="att") return fillAtt(el);
    if(ui.teamSub==="leaves") return fillLeaves(el);
    if(ui.teamSub==="duties") return fillDuties(el);
    const q=ui.empQ.trim().toLowerCase();
    const L=S.employees.filter(e=>(!ui.empG||(ui.empG==="ptw"?e.ptwAuth:e.group===ui.empG))&&(!q||(e.name+" "+(e.code||"")+" "+(e.job||"")).toLowerCase().includes(q))).sort((a,b)=>(a.group==="hse"?0:1)-(b.group==="hse"?0:1)||a.name.localeCompare(b.name,"ar"));
    if(!L.length){el.innerHTML=`<div class="card">${S.employees.length?emptyState("مفيش نتايج",""):emptyState("لسه مفيش موظفين","ضيف فريق السلامة والعمالة، أو استورد بيانات الإكسيل من الإعدادات.",`<button class="btn primary sm" onclick="importForm('employees')">لصق من Excel</button>`)}</div>`;return}
    const pg=page(L,"emps");
    el.innerHTML=`<div class="tbl"><table><thead><tr><th>الاسم</th><th>الكود</th><th>الوظيفة</th><th>المجموعة</th><th>الموبايل</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${pg.rows.map(e=>`<tr><td>${esc(e.name)}${e.ptwAuth?' <span class="pill p-open" title="معتمد في التصاريح">PTW</span>':""}</td><td><span class="num">${esc(e.code||"")}</span></td><td>${esc(e.job||"")}</td><td>${GROUPS[e.group]||""}${e.contractorId&&contractor(e.contractorId)?`<div class="muted" style="font-size:12px">${esc(contractor(e.contractorId).name)}</div>`:""}</td><td><span class="num">${esc(e.phone||"")}</span></td><td>${e.active===false?'<span class="pill p-closed">موقوف</span>':'<span class="pill p-appr">شغال</span>'}</td>
    <td><div class="row-actions">${attBtn("employees",e.id,e)}<button class="btn ghost sm" onclick="empForm('${e.id}')">تعديل</button>${canDelete?`<button class="btn ghost sm danger" onclick="empDel('${e.id}')">مسح</button>`:""}</div></td></tr>`).join("")}
    </tbody></table></div>${pg.btn}<p class="muted" style="font-size:12.5px">${L.length} موظف · فريق السلامة ${hseTeam().length}</p>`;
  }
};
function attTeam(){return hseTeam()}
function fillAtt(el){

  const recs=attDoc(ui.attDate)?.records||{};
  const c={};for(const e of team){const s=recs[e.id]?.s;if(s)c[s]=(c[s]||0)+1}
  $("attSum").textContent=Object.entries(ATT).map(([k,v])=>`${v[0]} ${c[k]||0}`).join(" · ")+` · من ${team.length}`;
  el.innerHTML=`<div class="card"><h3>فريق السلامة <span class="muted" style="font-weight:400">(${team.length}) · ${fmtDate(ui.attDate)}</span></h3><div class="list">
    ${team.map(e=>{const r=recs[e.id]||{};return `<div class="li" style="flex-wrap:wrap"><div class="grow" style="min-width:150px"><div class="t">${esc(e.name)}</div><div class="s">${esc(e.job||"")}${e.code?` · <span class="num">${esc(e.code)}</span>`:""}</div></div>
      <div class="seg" role="group" aria-label="حالة ${esc(e.name)}">${Object.entries(ATT).map(([k,v])=>`<button type="button" class="${v[1]}" aria-pressed="${r.s===k}" onclick="setAtt('${e.id}','${k}')" ${!canWrite?"disabled":""}>${v[0]}</button>`).join("")}</div></div>`}).join("")}
  </div></div>`;
}

  if(waiting("leaves")){el.innerHTML=waiting("leaves");return}

  el.innerHTML=`<div class="grid g2">

    <div class="card"><h3>إجازات ${monthName(ui.leaveMonth)}</h3>${L.length?`<div class="list">${L.map(l=>`<div class="li"><div class="grow"><div class="t">${esc(empName(l.empId))}</div><div class="s">${LEAVE_T[l.leaveType]||""} · ${fmtDate(l.date)}${l.to&&l.to!==l.date?" ← "+fmtDate(l.to):""}${l.note?" · "+esc(l.note):""}</div></div><span class="num">${num(l.days)} يوم</span><button class="btn ghost sm" onclick="printLeave('${l.id}')">👁 عرض</button>${attBtn("leaves",l.id,l)}${canDelete?`<button class="btn ghost sm danger" onclick="leaveDel('${l.id}')">مسح</button>`:""}</div>`).join("")}</div>`:emptyState("مفيش إجازات الشهر ده","")}</div>

  if(waiting("leaves")){el.innerHTML=waiting("leaves");return}

    ${L.map(l=>`<tr><td class="n">${fmtDate(l.date)}</td><td><span class="pill ${l.kind==="perm"?"p-susp":l.kind==="mission"?"p-open":"p-appr"}">${DUTY_K[l.kind]||l.kind}</span></td><td>${esc(empName(l.empId))}</td><td class="muted">${l.kind==="perm"?`من ${esc(l.from||"")} لحد ${esc(l.to||"")}`:esc(l.reason||"")}</td><td><div class="row-actions">${l.kind==="perm"?`<button class="btn ghost sm" onclick="printPerm('${l.id}')">👁 عرض</button>`:l.kind==="duty"?`<button class="btn ghost sm" onclick="printTeamDuty('${l.date}')">طباعة جماعي</button><button class="btn ghost sm" onclick="printMission('${l.id}')">فردي</button>`:l.kind==="mission"?`<button class="btn ghost sm" onclick="printMission('${l.id}')">👁 عرض</button>`:""}${attBtn("leaves",l.id,l)}${canDelete?`<button class="btn ghost sm danger" onclick="leaveDel('${l.id}')">مسح</button>`:""}</div></td></tr>`).join("")}
  </tbody></table></div>`:`<div class="card">${emptyState("مفيش تسجيلات في "+monthName(ui.dutyMonth),"التيم ديوتي (الشغل في يوم الراحة)، والمأموريات، وأذون الساعتين بتتسجل هنا.")}</div>`;
}
function leaveForm(){
  if(!hseTeam().length){toast("ضيف فريق السلامة الأول");return}
  openSheet("تسجيل إجازة",`<div class="form">
    ${f("الموظف","empId",{opts:empOpts(hseTeam()),req:true,full:true})}
    ${f("نوع الإجازة","leaveType",{opts:Object.entries(LEAVE_T)})}<div class="field"><label>الرصيد المتاح</label><div class="serial" id="balPrev">—</div></div>
    ${f("من","date",{type:"date",value:today(),req:true})}${f("لحد","to",{type:"date",value:today(),req:true})}
    ${f("القائم بالعمل","alt",{opts:empOpts(hseTeam(),"— اختار —")})}${f("تاريخ الطلب","reqDate",{type:"date",value:today()})}
    ${f("ملاحظات","note",{full:true})}</div>`,
  async fd=>{
    if(!fd.empId)return "اختار الموظف";
    if(fd.to<fd.date)return "تاريخ النهاية قبل البداية";
    const days=daysBetween(fd.date,fd.to);const e=emp(fd.empId);const fld=fd.leaveType==="casual"?"casual":fd.leaveType==="annual"?"annual":null;
    if(fld&&num(e[fld])<days)return `الرصيد مش كفاية: متاح ${num(e[fld])} يوم والإجازة ${days} يوم`;

async function runMigration(file){if(!file)return;const m=$("migMsg");const say=t=>{if(m)m.textContent=t};
  try{say("بيقرا الملف…");const J=JSON.parse(await file.text());let n=0;
    const docs=J.docs||[];for(let i=0;i<docs.length;i+=200){const chunk=docs.slice(i,i+200).map(d=>({col:d.col,id:d.id,data:d.data,updated_at:new Date().toISOString()}));
      if(chunk.some(d=>d.col==="settings")){for(const d of chunk.filter(d=>d.col==="settings")){const cur=S.settings||{};d.data={...d.data,...Object.fromEntries(Object.entries(cur).filter(([k])=>["webUrl"].includes(k)))}}}
      const {error}=await SB.from("docs").upsert(chunk);if(error)throw error;n+=chunk.length;say(`اتنقل ${n} من ${docs.length} سجل…`)}
    for(const p of J.private||[]){const {error}=await SB.from("private_docs").upsert({id:p.id,data:p.data});if(error)throw error}
    let fdone=0;for(const fl of J.files||[]){const bin=Uint8Array.from(atob(fl.b64),c=>c.charCodeAt(0));const {error}=await SB.storage.from("files").upload(fl.id,new Blob([bin],{type:fl.type}),{contentType:fl.type,upsert:true});if(error&&!/exists/i.test(error.message))throw error;fdone++}
    say(`✔ خلص النقل: ${n} سجل و${fdone} صورة والتوقيع. حدّث الصفحة.`);toast("خلص النقل")}catch(e){console.error(e);say("النقل فشل: "+(e.message||e))}}

const CHECKLIST_FORMS=["F-HSE-05-01","F-HSE-08-02","F-HSE-30-02","F-HSE-07-02","F-HSE-18-01"];
function deriveActions(){
  const out=[];const F2=FORMS2||{};const addD=(d,n)=>{try{const x=new Date((d||today())+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}catch(e){return today()}};
  for(const r of S.records){const sp=F2[r.form]||{};
    if(CHECKLIST_FORMS.includes(r.form))(r.rows||[]).forEach((row,i)=>{if(row?.res==="nok")out.push({id:`${r.id}_${i}`,recId:r.id,form:r.form,date:r.date,kind:"تفتيش",title:(sp.rows?.items?.[i]||`بند ${i+1}`).replace(/^[^.]*\.\s*/,""),detail:[row.measure,row.ncr&&("NCR "+row.ncr)].filter(Boolean).join(" · "),place:r.f?.site||"",due:addD(r.date,3)})});
    if(r.form==="F-HSE-07-03")(r.rows||[]).forEach((row,i)=>{if(row?.desc)out.push({id:`${r.id}_${i}`,recId:r.id,form:r.form,date:r.date,kind:"ملاحظة",title:row.desc,detail:row.action||"",place:row.place||"",due:addD(r.date,String(row.risk||"").startsWith("1")?1:7)})});
    if(r.form==="F-HSE-07-01")out.push({id:r.id+"_v",recId:r.id,form:r.form,date:r.date,kind:"مخالفة",title:r.f?.desc||"مخالفة",detail:[r.f?.emp,r.f?.action].filter(Boolean).join(" · "),place:r.f?.place||"",empId:r.f?.emp_id,due:addD(r.date,3)});
    if(r.form==="F-HSE-03-01"&&(r.f?.corrective||r.f?.immediate))out.push({id:r.id+"_c",recId:r.id,form:r.form,date:r.date,kind:"حادث",title:"إجراء تصحيحي: "+(r.f?.corrective||r.f?.immediate),detail:r.f?.desc||"",place:r.f?.place||"",ownerName:r.f?.resp||"",due:/^\d{4}-\d\d-\d\d$/.test(r.f?.timeline||"")?r.f.timeline:addD(r.date,7)});
  }
  for(const q of S.equipment){if(q.active===false)continue;const li=lastInsp(q);if(li&&eqOk(q)===false)out.push({id:`eq_${q.id}_${li.date}`,eqId:q.id,date:li.date,kind:"معدات",title:`${EQ_K[q.kind]?.one||""} ${q.serial||q.code||q.name||""} غير صالح`,detail:Object.entries(li.res||{}).filter(([,v])=>v==="nok").map(([k])=>(EQ_K[q.kind].checks.find(c=>c[0]===k)||[k,k])[1]).join("، ")+(li.notes?" · "+li.notes:""),place:q.place||"",due:addD(li.date,3),auto:true})}
  const T=new Map(S.actions.map(a=>[a.id,a]));const res=[];
  for(const d of out){const tr=T.get(d.id)||{};T.delete(d.id);res.push({...d,...tr,id:d.id,derived:true})}
  for(const a of T.values())if(a.manual)res.push(a);
  return res.map(a=>({...a,status:a.status||"open",late:(a.status||"open")!=="closed"&&a.due&&a.due<today()}));
}

function compose(cards,perPage,landscape){const W=landscape?1754:1241,H=landscape?1241:1754;const out=[];
  for(let i=0;i<cards.length;i+=perPage){const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
    cards.slice(i,i+perPage).forEach((cv,j)=>{const cols=perPage===4?2:1,rows=perPage===1?1:2;const cw=W/cols,ch=H/rows;const s=Math.min(cw/cv.width,ch/cv.height)*0.97;const w=cv.width*s,h=cv.height*s;
      const col=perPage===4?(1-(j%2)):0;g.drawImage(cv,col*cw+(cw-w)/2,Math.floor(j/cols)*ch+(ch-h)/2,w,h)});out.push(c)}return out}

  const W=1240,H=1754,out=[];const per=imgs.length===1?1:imgs.length===2?2:4;

    g.strokeStyle="#999";g.lineWidth=2;g.beginPath();g.moveTo(80,190);g.lineTo(W-80,190);g.stroke();
    const chunk=imgs.slice(s,s+per),cols=per===4?2:1,rows=per===1?1:2,top=220,gap=30,cw=(W-160-(cols-1)*gap)/cols,ch=(H-top-100-(rows-1)*gap)/rows;

function xlNorm(v){return String(v??"").normalize("NFKC").toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[\u0622\u0623\u0625\u0671]/g,"\u0627").replace(/\u0649/g,"\u064a").replace(/\u0629/g,"\u0647").replace(/[\s\u00a0_\/-]/g,"")}
function xlSheet(wb,name){const n=wb.SheetNames.find(x=>xlNorm(x)===xlNorm(name));if(!n)return null;const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""});return {name:n,headers:(a.shift()||[]).map(x=>String(x??"").trim()),rows:a.filter(r=>r.some(v=>String(v??"").trim()))}}
function xlCol(sheet,row,aliases){if(!sheet)return"";const keys=aliases.map(xlNorm);const ix=sheet.headers.findIndex(h=>keys.includes(xlNorm(h)));return ix<0?"":String(row[ix]??"").trim()}
function xlNum(v){const s=String(v??"").replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d))).replace(/[٬،]/g,",").replace(/,/g,"").replace(/[^0-9.+-]/g,"");const n=Number(s);return Number.isFinite(n)?n:0}
function xlDate(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);const s=String(v??"").trim();if(!s)return"";let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=y<50?2000:1900;return `${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`}return""}
function xlCode(v){return String(v??"").trim().replace(/\.0$/," ").trim()}
function xlGroup(v){const n=xlNorm(v);if(!n)return"";if(n==="hse"||n.includes("سلامة")||n.includes("السلامة"))return"hse";if(n.includes("مقاول")||n.includes("contractor"))return"ctr";if(n.includes("اشراف")||n.includes("supervisor"))return"sup";for(const [k,label] of Object.entries(GROUPS))if(n===xlNorm(k)||n===xlNorm(label))return k;return""}
function xlPtwType(v){const n=xlNorm(v);if(n.includes("cold")||n.includes("بارد"))return"COLD";if(n.includes("hot")||n.includes("ساخن"))return"HOT";if(n.includes("height")||n.includes("ارتفاع"))return"HEIGHT";if(n.includes("lift")||n.includes("رفع"))return"LIFT";if(n.includes("confined")||n.includes("مغلقة"))return"CONF";return""}
async function readExcelWorkbook(file){if(!file)return;const box=$("excelImportPreview");if(!box)return;box.innerHTML='<p class="muted">بيقرأ الملف محليًا…</p>';try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:"array",cellDates:true});excelImportRows={name:file.name,employees:xlSheet(wb,"Employees"),stock:xlSheet(wb,"Stock"),transactions:xlSheet(wb,"Transactions"),permits:xlSheet(wb,"PTW_DATABASE")};if(!excelImportRows.employees&&!excelImportRows.stock&&!excelImportRows.permits)throw new Error("مش لاقي شيت Employees أو Stock أو PTW_DATABASE");buildExcelImportPlan()}catch(e){excelImportRows=null;excelImportPlan=null;box.innerHTML=`<div class="msg">معرفتش أقرأ الملف: ${esc(e.message||e)}</div>`}}
function buildExcelImportPlan(){
  if(!excelImportRows)return;const src=excelImportRows,group=$("excelDefaultGroup")?.value||"worker",employees=[],stock=[],closed=[],counts={missingEmp:0,dupEmp:0,ambEmp:0,missingStock:0,dupStock:0,ambStock:0,openPermits:0,invalidPermits:0,dupPermits:0};
  const ec=(src.employees?.rows||[]).map(r=>({r,code:xlCode(xlCol(src.employees,r,["كود","الكود","code","employee code"])),name:xlCol(src.employees,r,["الاسم","اسم الموظف","name"])})).filter(x=>x.name),ef=new Map();for(const x of ec)if(x.code)ef.set(x.code,(ef.get(x.code)||0)+1);
  for(const x of ec){if(!x.code){counts.missingEmp++;continue}if(ef.get(x.code)>1){counts.dupEmp++;continue}const m=S.employees.filter(e=>xlCode(e.code)===x.code);if(m.length>1){counts.ambEmp++;continue}const groupValue=xlGroup(xlCol(src.employees,x.r,["المجموعة","group"]));employees.push({id:m[0]?.id||`xl_emp_${x.code.replace(/[^A-Za-z0-9_-]/g,"_")}`,existing:!!m[0],data:{name:x.name,code:x.code,job:xlCol(src.employees,x.r,["الوظيفة","job"]),group:groupValue||m[0]?.group||group}})}
  const sc=(src.stock?.rows||[]).map(r=>({r,code:xlCode(xlCol(src.stock,r,["كود الصنف","الكود","code"])),name:xlCol(src.stock,r,["اسم الصنف","الصنف","name"])})).filter(x=>x.name||x.code),sf=new Map();for(const x of sc)if(x.code)sf.set(x.code,(sf.get(x.code)||0)+1);
  for(const x of sc){if(!x.code||!x.name){counts.missingStock++;continue}if(sf.get(x.code)>1){counts.dupStock++;continue}const m=S.items.filter(i=>xlCode(i.code)===x.code);if(m.length>1){counts.ambStock++;continue}stock.push({id:m[0]?.id||`xl_item_${x.code.replace(/[^A-Za-z0-9_-]/g,"_")}`,existing:!!m[0],code:x.code,name:x.name,available:xlNum(xlCol(src.stock,x.r,["الرصيد المتاح","الرصيد الحالي","available"]))})}
  const pc=src.permits?.rows||[],pf=new Set(),existingP=new Set(S.permits.map(p=>`${p.type}-${p.serial||String(p.number||"").split("-").pop()}`));
  for(const r of pc){const status=xlNorm(xlCol(src.permits,r,["الحالة","status"]));if(status.includes("open")||status.includes("مفتوح")){counts.openPermits++;continue}if(!(status.includes("closed")||status.includes("مغلق")))continue;const type=xlPtwType(xlCol(src.permits,r,["نوع التصريح","النوع","type"])),serial=xlCode(xlCol(src.permits,r,["رقم المسلسل","الرقم المسلسل","رقم التصريح","serial","number"])),date=xlDate(xlCol(src.permits,r,["تاريخ الإصدار","تاريخ التصريح","التاريخ","date"]));if(!type||!serial||!date){counts.invalidPermits++;continue}const id=`${type}-${serial}`;if(pf.has(id)||existingP.has(id)){counts.dupPermits++;continue}pf.add(id);closed.push({id,type,serial,date,safetyName:xlCol(src.permits,r,["مسؤول السلامة","المسؤول","safety"]),source:xlCol(src.permits,r,["المصدر","source"])})}
  const transCount=(src.transactions?.rows||[]).length;excelImportPlan={employees,stock,closed,counts,transCount};
  const box=$("excelImportPreview");if(!box)return;box.innerHTML=`<div class="card" style="padding:12px"><b>معاينة الملف: ${esc(src.name)}</b><div class="grid g3" style="margin-top:8px"><div>الموظفون: <b>${employees.filter(x=>!x.existing).length}</b> جديد · ${employees.filter(x=>x.existing).length} تحديث · ${counts.missingEmp+counts.dupEmp+counts.ambEmp} مستبعدون</div><div>أصناف المخزن: <b>${stock.filter(x=>!x.existing).length}</b> جديد · ${stock.filter(x=>x.existing).length} تحديث · ${counts.missingStock+counts.dupStock+counts.ambStock} مستبعدة</div><div>تصاريح مغلقة: <b>${closed.length}</b> قابلة للأرشفة · ${counts.dupPermits} مكرر</div></div><div class="form" style="margin-top:10px"><label class="muted" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="excelImportBalances"> حدّث الرصيد المتاح للأصناف من الملف. ستُضبط قيمة الرصيد الافتتاحي مع إبقاء حركات المنظومة الحالية.</label><label class="muted" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="excelImportClosed"> استورد ${closed.length} تصريحًا مغلقًا كسجل تاريخي مختصر</label></div><p class="muted" style="font-size:12.5px;margin:8px 0">${counts.openPermits} تصريح مفتوح مستبعد من النقل الآلي لتجنب تنبيهات الإغلاق الجماعية. ${transCount} صف حركة مخزن لم يُستورد: عمود التاريخ بلا عنوان ورقم الإذن غير موجود، فلا يمكن منع التكرار بأمان. البيانات لا تُحفظ إلا بعد الضغط على زر التطبيق.</p><button class="btn primary" id="excelApply" type="button">تطبيق الصفوف الآمنة المحددة</button></div>`;$("excelApply").onclick=applyExcelImport;
}
function applyExcelImport(){
  if(!isOwner||!db||!excelImportPlan){toast("اختار ملف Excel أولًا بصلاحية صاحب المنظومة");return}const plan=excelImportPlan,doBal=$("excelImportBalances")?.checked,doClosed=$("excelImportClosed")?.checked,jobs=[];
  for(const x of plan.employees){const data={...x.data,updatedAt:Date.now()};if(!x.existing){data.active=true;data.createdAt=Date.now()}jobs.push({col:"employees",id:x.id,data})}
  const mt=moveTotals();for(const x of plan.stock){const cur=S.items.find(i=>i.id===x.id);const data={code:x.code,name:x.name,updatedAt:Date.now()};if(!cur){data.unit="قطعة";data.min=0;data.createdAt=Date.now()}if(doBal){const net=cur?(mt[x.id]?.inn||0)-(mt[x.id]?.out||0):0;data.opening=x.available-net}jobs.push({col:"ppe_items",id:x.id,data})}
  if(doClosed)for(const x of plan.closed)jobs.push({col:"permits",id:x.id,data:{type:x.type,serial:Number(x.serial)||x.serial,number:x.id,date:x.date,status:"closed",risk:"med",safetyName:x.safetyName||"",desc:"سجل تاريخي مختصر مستورد من ملف Excel؛ تفاصيل الموقع ووصف العمل غير متوفرة في المصدر.",legacySource:x.source||"Excel",legacyImport:true,createdAt:Date.now(),updatedAt:Date.now()}});
  if(!jobs.length){toast("مافيش صفوف محددة للاستيراد");return}confirmSheet("تأكيد استيراد Excel",`هيتحفظ ${plan.employees.length} موظف و${plan.stock.length} صنف${doClosed?` و${plan.closed.length} تصريح مغلق أرشيفي`:""} في قاعدة المنظومة الخاصة. راجع المعاينة قبل المتابعة.`,async()=>{
    let i=0,done=0,fail=0;importing=true;const box=$("excelImportPreview");const work=async()=>{while(i<jobs.length){const j=jobs[i++];let ok=false;for(let t=0;t<3&&!ok;t++){try{await upsert(j.col,j.id,j.data);ok=true}catch(e){if(t<2)await new Promise(r=>setTimeout(r,250*(t+1)))}}if(ok)done++;else fail++;if(box&&done%10===0)box.querySelector("b")&&(box.querySelector("b").textContent=`اتحفظ ${done} من ${jobs.length}…`)}};await Promise.all(Array.from({length:6},work));importing=false;refresh();if(fail)toast(`اتحفظ ${done} صف، وتعذر حفظ ${fail}. أعد اختيار الملف للمتابعة`);else toast(`تم استيراد ${done} سجل`)
  },"احفظ البيانات");
}

/* ---------- KPI ---------- */
function kpiTargets(){const t=S.settings.targets||{};const o={};for(const k of KPIS)o[k.k]=num(t[k.k])||k.def;return o}
function kpiAuto(empId,month){
  const o={inspection:0,unsafeCond:0,unsafeActs:0,corrective:0,tbt:0};const e=emp(empId);const nm=e?normName(e.name):"#";
  const by=(r,...ks)=>ks.some(k=>r.f?.[k+"_id"]===empId||(r.f?.[k]&&normName(r.f[k])===nm));
  for(const r of S.records){if(!(r.date||"").startsWith(month))continue;
    if(CHECKLIST_FORMS.includes(r.form)&&by(r,"officer"))o.inspection++;
    if(r.form==="F-HSE-07-03"&&by(r,"reporter"))for(const x of r.rows||[]){if(x?.kind==="USC")o.unsafeCond++;else if(x?.kind==="USA")o.unsafeActs++}
    if(r.form==="F-HSE-07-01"&&by(r,"writer","officer"))o.unsafeActs++;
    if((r.form==="F-HSE-24-02"&&by(r,"trainer"))||(r.form==="F-HSE-24-01"&&by(r,"lecturer")))o.tbt++;}
  for(const q of S.equipment)for(const h of q.insp||[])if((h.date||"").startsWith(month)&&(h.by_id===empId||normName(h.by||"")===nm))o.inspection++;
  for(const a of S.actions)if(a.status==="closed"&&(a.closedAt||"").startsWith(month)&&a.closedBy===empId)o.corrective++;
  return o;
}
function kpiSummary(month){
  const T=kpiTargets();
  return hseTeam().map(e=>{
    const E=S.kpi.filter(x=>x.empId===e.id&&(x.date||"").startsWith(month));const AU=kpiAuto(e.id,month);
    const sums={};for(const k of KPIS)sums[k.k]=E.reduce((a,x)=>a+num(x[k.k]),0)+(AU[k.k]||0);const autoN=Object.values(AU).reduce((a,b)=>a+b,0);
    const ach=KPIS.map(k=>Math.min(150,T[k.k]?sums[k.k]/T[k.k]*100:0));
    const score=Math.round(ach.reduce((a,b)=>a+b,0)/KPIS.length);
    return {id:e.id,name:e.name,sums,entries:E.length+autoN,auto:AU,score};
  }).filter(r=>r.entries>0).sort((a,b)=>b.score-a.score);
}

/* ---------- Monthly report ---------- */
function monthReport(m){
  const P=S.permits.filter(p=>(p.date||"").startsWith(m));
  const byType=Object.keys(PTW_TYPES).map(t=>[t,P.filter(p=>p.type===t).length]).filter(x=>x[1]);
  const byStatus=Object.keys(PTW_STATUS).map(s=>[s,P.filter(p=>p.status===s).length]).filter(x=>x[1]);
  const M=S.moves.filter(x=>(x.date||"").startsWith(m)&&x.type==="issue");
  const byItem={};for(const x of M)byItem[x.itemId]=(byItem[x.itemId]||0)+num(x.qty);
  const topItems=Object.entries(byItem).sort((a,b)=>b[1]-a[1]);
  const days=S.att.filter(a=>(a.id||"").startsWith(m));
  const att={};for(const d of days)for(const [eid,r] of Object.entries(d.records||{})){(att[eid]??={p:0,a:0,v:0,m:0,e:0});if(r.s)att[eid][r.s]++}
  const K=kpiSummary(m);
  return {P,byType,byStatus,M,topItems,days,att,K};
}

async function runImport(){

  btn.disabled=true; st.textContent="بيحمّل ملف البيانات…";
  let data; try{data=await fetch("legacy.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}catch(e){st.textContent="ملف بيانات الإكسيل مش موجود مع الصفحة. اطلبه من Claude.";btn.disabled=false;return}

  add("employees",data.employees);add("ppe_items",data.items);add("permits",data.permits);add("ppe_moves",data.moves);add("kpi_entries",data.kpi);add("leaves",data.leaves);

  const total=jobs.length;let done=total-todo.length,fail=0,i=0;
  const upd=()=>{st.textContent=`اتنقل ${done} من ${total} سجل…`;$("impBar").style.width=(done/total*100)+"%"};
  importing=true;upd();

  await Promise.all(Array.from({length:6},worker));
  try{await db.doc("settings/main").set({...S.settings,serials:{...(S.settings.serials||{}),...data.serials},targets:Object.fromEntries(KPIS.map(k=>[k.k,num(S.settings.targets?.[k.k])||k.def])),importedAt:Date.now()})}catch(e){fail++}
  importing=false;upd();

  btn.disabled=false;toast(fail?"الاستيراد خلص مع أخطاء":"الاستيراد خلص");
}

function recVal(spec,rec,k,depth=0){
  const f=spec.fields.find(x=>x.k===k);const raw=rec.f?.[k];
  if(raw!=null&&raw!==""){if(f?.type==="emp"){const e=empById(rec.f[k+"_id"]);return e?e.name:raw}return raw}
  if(!f||depth>3)return "";
  if(f.auto){const [src,attr]=f.auto.split(".");
    if(src==="serial")return String(rec.serial||"");
    if(src==="date")return recVal(spec,rec,"date",depth+1)||rec.date||"";
    if(src==="me")return S.settings.leaderName||"اسلام بكر عباس";
    const e=empById(rec.f?.[src+"_id"]);if(e&&attr)return String(e[attr]||"");

  }
  return f.default||"";

async function renderGenericBase(fid,rec){

  for(let k=0;k<spec.pages.length;k++){

    const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(bg,0,0,W,H);const pxPt=150/72;
    const font=s=>`600 ${s}px "IBM Plex Sans Arabic",Arial,sans-serif`;
    const text=(t,r,opt={})=>{if(t==null||t==="")return;t=String(t);const bx=r[0]*W,by=r[1]*H,bw=r[2]*W,bh=r[3]*H;
      if(opt.fill){x.fillStyle="#fff";x.fillRect(bx+1,by+1,bw-2,bh-2)}
      x.fillStyle="#111";x.textBaseline="middle";const rtl=/[؀-ۿ]/.test(t);x.direction=rtl?"rtl":"ltr";
      if(opt.lines>1){let fs=Math.min(11*pxPt,bh/opt.lines*0.62);x.font=font(fs);const lh=bh/opt.lines;

        while(lines.length>opt.lines&&fs>9){fs-=1;x.font=font(fs);lines=[];for(const para of t.split(/\n/))lines.push(...wrapLines(x,para,bw-12))}
        x.textAlign=rtl?"right":"left";lines.slice(0,Math.max(opt.lines,Math.floor(bh/(fs*1.3)))).forEach((l,i)=>x.fillText(l,rtl?bx+bw-6:bx+6,by+lh*(i+0.5)));return}
      let fs=Math.min(11*pxPt,bh*0.7);x.font=font(fs);while(x.measureText(t).width>bw-8&&fs>8){fs-=1;x.font=font(fs)}
      x.textAlign="center";x.fillText(t,bx+bw/2,by+bh/2+1)};
    const tick=r=>{const bx=r[0]*W,by=r[1]*H,bw=r[2]*W,bh=r[3]*H;x.strokeStyle="#111";x.lineWidth=Math.max(2,bw*0.14);x.beginPath();x.moveTo(bx+bw*0.15,by+bh*0.55);x.lineTo(bx+bw*0.42,by+bh*0.85);x.lineTo(bx+bw*0.95,by+bh*0.05);x.stroke()};
    for(const f of spec.fields.filter(f=>f.page===k)){
      if(f.type==="check"){const v=rec.f?.[f.k];const sel=Array.isArray(v)?v:(v?[v]:[]);for(const o of sel)if(f.opts[o])tick(f.opts[o]);continue}
      text(fmtFieldVal(f,recVal(spec,rec,f.k)),f.rect,{fill:f.fill,lines:f.type==="textarea"?(f.lines||3):1});
    }
    const R=spec.rows;

      let any=false;

        if(col.type==="check"){const sel=Array.isArray(v)?v:(v?[v]:[]);for(const o of sel)if(cells[col.k][o])tick(cells[col.k][o]);if(sel.length)any=true;continue}
        if((v==null||v==="")&&col.auto){const [src,attr]=col.auto.split(".");const e=empById(row[src+"_id"]);v=e?e[attr]:""}
        if(v){any=true;text(col.type==="date"&&/^\d{4}-\d\d-\d\d$/.test(v)?fmtDate(v):v,cells[col.k],{fill:col.fill,lines:col.type==="textarea"?(col.lines||3):1})}}
      if(any&&R.num&&cells.__num)text(String(i+1),cells.__num);
    })}
    out.push(c);
  }

function fridays(y,m){let c=0;const n=new Date(y,m,0).getDate();for(let d=1;d<=n;d++)if(new Date(y,m-1,d).getDay()===5)c++;return c}
function statsDefaults(y,h){const prev=statsDoc(prevHalf({y,h}))||{};const months=[];const m0=h===1?1:7;
  for(let i=0;i<6;i++){const m=m0+i;months.push({m,days:new Date(y,m,0).getDate(),rest:fridays(y,m),hol:0})}

  const [a,b]=halfRange({y,h});const inc=S.records.filter(r=>r.form==="F-HSE-03-01"&&r.date>=a&&r.date<=b);
  return {kind:"stats",y,h,male:w,female:0,hours:prev.hours||9,restDay:prev.restDay||"الجمعة",months,

    injured:inc.map(r=>({name:r.f?.victim||"",date:r.date,time:r.f?.time||"",place:r.f?.place||"",type:r.f?.injury||"",days:""})),
    serious:[],dis3:(prev.dis3||DIS3_DEF.map(t=>({t,n:""}))),dis3cases:[],dis5:{},dis5days:{},chronic:[]}}
function statsCalc(s){const act=s.months.map(x=>Math.max(0,num(x.days)-num(x.rest)-num(x.hol)));const tot={days:s.months.reduce((a,x)=>a+num(x.days),0),rest:s.months.reduce((a,x)=>a+num(x.rest),0),hol:s.months.reduce((a,x)=>a+num(x.hol),0),act:act.reduce((a,b)=>a+b,0)};
  const W=num(s.male)+num(s.female),hrs=num(s.hours)||9;const injN=num(s.lost?.inj?.n),injD=num(s.lost?.inj?.d)+num(s.lost?.serious?.d)+num(s.lost?.occ?.d);
  const den=W*hrs*tot.act;const fr=den?injN*1e6/den:0,sv=den?injD*1e6/den:0;return {act,tot,W,hrs,injN,injD,den,fr,sv}}

    <div class="full"><h3 style="margin:8px 0 4px">أيام العمل الفعلية</h3><table class="ed"><thead><tr><th>الشهر</th><th>أيام الشهر</th><th>الراحات الأسبوعية</th><th>العطلات الرسمية</th></tr></thead><tbody>${s.months.map((x,i)=>`<tr><td>${nm[x.m]}</td><td><input class="mini" inputmode="numeric" name="m${i}_days" value="${x.days}"></td><td><input class="mini" inputmode="numeric" name="m${i}_rest" value="${x.rest}"></td><td><input class="mini" inputmode="numeric" name="m${i}_hol" value="${x.hol}"></td></tr>`).join("")}</tbody></table><p class="muted" style="font-size:12.5px">الراحات اتحسبت أيام الجمعة. اكتب العطلات الرسمية لكل شهر.</p></div>

async function statsView(y,h){const s=statsDoc({y,h});if(!s){statsForm(y,h);return}await sigData();
  const personalSig=await mySig();const V=openViewer(`إحصائيات مكتب العمل · ${halfLabel({y,h})}`,{filename:`احصائيات مكتب العمل ${y}-${h===1?"1 الى 6":"7 الى 12"}.pdf`,
    extra:`${tabLevel("office")!=="view"?`<button class="btn" data-extra onclick="pvClose();statsForm(${y},${h})">✏️ تعديل</button>`:""}${personalSig?(s.approved?`<button class="btn" data-extra onclick="statsApprove(${y},${h},false)">إلغاء الاعتماد</button>`:`<button class="btn sign" data-extra onclick="statsApprove(${y},${h},true)">✍ اعتماد بتوقيعي</button>`):""}`});
  if(s.approved)V.note("✔ معتمدة بتوقيع "+esc(s.approved.name||""),true);
  try{V.setHtml(await statsHTML(s))}catch(e){console.error(e);V.fail()}}
async function statsApprove(y,h,yes){const id="stats_"+halfKey({y,h});const signature=yes?await mySig():"";if(yes&&!signature){toast("ضيف توقيعك الأول من ملفك الشخصي");return}if(await write(()=>upsert("office",id,{approved:yes?{by:ME.id,at:Date.now(),name:myEmpName(),signature}:null}),yes?"اتعتمدت ✔":"اتلغى الاعتماد"))setTimeout(()=>statsView(y,h),300)}

    const rooms=[{r:"team",n:"👥 فريق المنظومة",s:"كل الفريق"},...people.map(p=>({r:dmKey(ME.id,p.id),n:profName(p),s:ROLES_ALL()[p.role]?.ar||(p.role==="admin"?"مدير المنظومة":"")}))];
    const M=CHAT.filter(m=>m.room===r).slice(-150);const draft=keepInput?($("chIn")?.value||""):"";
    const bubble=m=>{const mine=m.from_uid===ME.id;return `<div style="display:flex;justify-content:${mine?"flex-start":"flex-end"};margin:6px 0"><div style="max-width:78%;background:${mine?"var(--accent-soft)":"var(--surface)"};border:1px solid var(--line);border-radius:14px;padding:8px 12px">${!mine&&r==="team"?`<div style="font-size:12px;font-weight:700;color:var(--accent)">${esc(m.from_name||"")}</div>`:""}${m.img?`<img src="/_blob/${esc(m.img)}" data-view="/_blob/${esc(m.img)}" alt="" style="max-width:220px;max-height:220px;border-radius:10px;display:block;margin:4px 0;cursor:zoom-in">`:""}${m.text?`<div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.text)}</div>`:""}${m.ref?`<button class="chipbtn" style="margin-top:4px" onclick="goTo('?go=${esc(m.ref.kind)}&id=${esc(m.ref.id)}')">📎 ${esc(m.ref.label||"")}</button>`:""}<div class="muted" style="font-size:10.5px;margin-top:2px;text-align:left">${new Date(m.at).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"})}</div></div></div>`};
    $("chBody").innerHTML=`<div style="display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:12px" class="chgrid">
      <div class="card" style="padding:6px;max-height:70vh;overflow:auto" id="chRooms">${rooms.map(x=>{const u=unreadOf(x.r);return `<button type="button" data-room="${x.r}" style="display:flex;width:100%;gap:8px;align-items:center;text-align:right;background:${x.r===r?"var(--accent-soft)":"none"};border:0;border-radius:10px;padding:9px 10px;font:inherit;color:inherit;cursor:pointer"><div class="grow" style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.n)}</div><div class="muted" style="font-size:11.5px">${esc(x.s)}</div></div>${u?`<span class="pill p-canc">${u}</span>`:""}</button>`}).join("")}</div>
      <div class="card" style="display:flex;flex-direction:column;height:70vh;padding:0;overflow:hidden"><div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700">${esc(roomName(r))}</div>
        <div id="chMsgs" style="flex:1;overflow:auto;padding:8px 14px;background:var(--bg)">${M.length?M.map(bubble).join(""):`<div class="empty">ابدأ المحادثة 👋</div>`}</div>
        <div id="chRef" style="padding:0 10px"></div>
        <form id="chForm" style="display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);align-items:flex-end"><label class="btn ghost" style="cursor:pointer" title="صورة">📷<input type="file" accept="image/*" id="chImg" hidden></label><button type="button" class="btn ghost" id="chAtt" title="إرفاق تصريح أو نموذج">📎</button><textarea id="chIn" rows="1" placeholder="اكتب رسالة…" style="flex:1;min-height:42px;max-height:120px;resize:none">${esc(draft)}</textarea><button class="btn primary keep" type="submit">إرسال</button></form></div></div>
      <style>@media (max-width:760px){.chgrid{grid-template-columns:1fr!important}#chRooms{max-height:150px!important;display:flex;overflow-x:auto}#chRooms button{min-width:150px}}</style>`;
    const box=$("chMsgs");box.scrollTop=box.scrollHeight;let ref=null,img=null;
    $("chRooms").onclick=e=>{const b=e.target.closest("[data-room]");if(b){ui.chatRoom=b.dataset.room;this.fill()}};
    $("chIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!isMobile()){e.preventDefault();$("chForm").requestSubmit()}});
    $("chImg").onchange=async e=>{const fl=e.target.files[0];if(!fl||!assetsNS)return;toast("بيرفع الصورة…");try{const b=await shrinkImage(fl);const x=await assetsNS.upload(b,{type:b.type||"image/jpeg"});img=x.id;$("chRef").innerHTML=`<div class="chipbtn" style="margin:6px 0">📷 صورة جاهزة للإرسال</div>`}catch(err){toast("الرفع فشل")}};
    $("chAtt").onclick=()=>{const P=S.permits.filter(p=>!ptwDraft(p)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,25);const Rr=S.records.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,25);
      $("chRef").innerHTML=`<select id="chRefSel" style="width:100%;margin:6px 0"><option value="">— اختار تصريح أو نموذج —</option><optgroup label="تصاريح">${P.map(p=>`<option value="ptw|${p.id}|${esc(p.number+" · "+(p.location||""))}">${esc(p.number)} · ${esc(p.location||"")}</option>`).join("")}</optgroup><optgroup label="نماذج">${Rr.map(r=>`<option value="rec|${r.id}|${esc(r.form+" · "+fmtDate(r.date))}">${esc(r.form)} · ${fmtDate(r.date)}</option>`).join("")}</optgroup></select>`;
      $("chRefSel").onchange=e=>{const [kind,id,label]=e.target.value.split("|");ref=id?{kind,id,label}:null}};
    $("chForm").onsubmit=async e=>{e.preventDefault();const text=$("chIn").value.trim();if(!text&&!img&&!ref)return;
      const other=roomOther(r);const row={room:r,members:r==="team"?null:[ME.id,other],from_name:myEmpName(),text,img,ref};
      const {data,error}=await SB.from("chat").insert(row).select().single();if(error){toast("الرسالة ما اتبعتتش");return}
      $("chIn").value="";onChatInsert(data);
      const to=r==="team"?(S.profiles||[]).filter(p=>!p.disabled).map(p=>p.id):[other];notifyCall({action:"send",to:to.filter(u=>u!==ME.id),title:`💬 ${myEmpName()}${r==="team"?" · الفريق":""}`,body:text||(img?"📷 صورة":"📎 "+(ref?.label||"")),url:`?go=chat&id=${r}`},true).catch(()=>{})}}};


show(tab);
boot();
</script>
</body></html>
